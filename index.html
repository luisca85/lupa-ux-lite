<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lupa UX — herramienta de diagnóstico y evaluación heurística de UX.">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Lupa UX</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<header class="top">
  <div class="top-in">
    <button class="brand" id="brandBtn" title="Ir a estudios" aria-label="Inicio">
      <svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/><path d="M10.5 7.8v5.4M7.8 10.5h5.4" opacity=".5"/></svg>
      Lupa <small>UX</small>
    </button>
    <nav class="topnav" id="topNav"></nav>
    <div class="spacer"></div>
    <span class="badge-local hidden" id="localBadge" title="Los datos se guardan en este navegador">modo local</span>
    <div class="user-slot" id="userSlot"></div>
    <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </div>
</header>

<div class="app">
  <main id="view"></main>
  <div class="foot-note" id="footNote"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
