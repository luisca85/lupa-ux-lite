# Cloudflare Pages + Functions + D1
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "lupa-ux"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-01"

# --- Desarrollo local (npm run dev) ---
# D1 corre como SQLite local en .wrangler/. Sin Cloudflare Access.
[vars]
AUTH_MODE = "none"

# El database_id de acá solo identifica la base LOCAL (.wrangler/). No cambiarlo:
# otro valor arranca una base local vacía.
[[d1_databases]]
binding = "DB"
database_name = "lupaux"
database_id = "REEMPLAZAR_CON_DATABASE_ID"
migrations_dir = "migrations"

# --- Producción (rama main) ---
# Los bindings no se heredan entre entornos: hay que repetir D1 acá.
# Cuentas con código por email (spec cta). Los secretos NO van acá (el repo es público):
#   npx wrangler pages secret put RESEND_API_KEY      (y TURNSTILE_SITE_KEY, TURNSTILE_SECRET,
#   ADMIN_EMAILS, RESERVA_TO) — ver docs/lanzamiento.md.
# Beta privada: con SOLO_AUTORIZADOS="1" solo crean cuenta los emails autorizados con
#   node scripts/autorizar.mjs --email ... --remote   (MAX_CUENTAS deja de aplicar).
# Sin beta privada, MAX_CUENTAS sube por tandas: 20 → 50 → 100.
# ACCESS_* queda hasta quitar Cloudflare Access (último paso del lanzamiento).
[env.production.vars]
AUTH_MODE = "cuentas"
SOLO_AUTORIZADOS = "1"
MAX_CUENTAS = "20"
SESION_DIAS = "30"
AUTH_FROM = "Mutis UX <acceso@uxuaria.com>"
ACCESS_TEAM_DOMAIN = "https://tight-forest-2b64.cloudflareaccess.com"
ACCESS_AUD = "1bc8e4aad1fce1a0ecb9b9af4004346d9fd1f10105b0cb444c74bb47bee2da79"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lupaux"
database_id = "9f07f91f-4ffd-4bff-ade2-f280b022dfc9"
migrations_dir = "migrations"

# --- Previews (otras ramas) ---
# Mismo candado que producción, pero base APARTE: una rama nunca toca datos reales.
# Sirve para probar el login con cuentas antes de pasarlo a main.
[env.preview.vars]
AUTH_MODE = "cuentas"
SOLO_AUTORIZADOS = "1"
MAX_CUENTAS = "20"
SESION_DIAS = "30"
AUTH_FROM = "Mutis UX <acceso@uxuaria.com>"
ACCESS_TEAM_DOMAIN = "https://tight-forest-2b64.cloudflareaccess.com"
ACCESS_AUD = "1bc8e4aad1fce1a0ecb9b9af4004346d9fd1f10105b0cb444c74bb47bee2da79"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "lupaux-preview"
database_id = "bccf1f61-6767-4d41-92b0-02100ae6adae"
migrations_dir = "migrations"
