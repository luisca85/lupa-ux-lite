# Cloudflare Pages + Functions + D1
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "lupa-ux"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-01"

# --- Desarrollo local (npm run dev) ---
# D1 corre como SQLite local en .wrangler/. Sin Cloudflare Access.
[vars]
AUTH_MODE = "none"

[[d1_databases]]
binding = "DB"
database_name = "lupaux"
database_id = "REEMPLAZAR_CON_DATABASE_ID"   # lo devuelve: npx wrangler d1 create lupaux
migrations_dir = "migrations"

# --- Producción (rama main) ---
# Los bindings no se heredan entre entornos: hay que repetir D1 acá.
[env.production.vars]
AUTH_MODE = "access"
ACCESS_TEAM_DOMAIN = "https://REEMPLAZAR.cloudflareaccess.com"
ACCESS_AUD = "REEMPLAZAR_CON_AUD_DE_LA_APP_DE_ACCESS"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lupaux"
database_id = "REEMPLAZAR_CON_DATABASE_ID"
migrations_dir = "migrations"

# --- Previews (otras ramas) ---
# Misma base y mismo candado que producción.
[env.preview.vars]
AUTH_MODE = "access"
ACCESS_TEAM_DOMAIN = "https://REEMPLAZAR.cloudflareaccess.com"
ACCESS_AUD = "REEMPLAZAR_CON_AUD_DE_LA_APP_DE_ACCESS"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "lupaux"
database_id = "REEMPLAZAR_CON_DATABASE_ID"
migrations_dir = "migrations"
