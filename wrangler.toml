# Cloudflare Pages + Functions + D1
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "lupa-ux"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-01"

# --- Desarrollo local (npm run dev) ---
# D1 corre como SQLite local en .wrangler/. Sin Cloudflare Access.
[vars]
AUTH_MODE = "none"

# El database_id de acá solo identifica la base LOCAL (.wrangler/). No cambiarlo:
# otro valor arranca una base local vacía.
[[d1_databases]]
binding = "DB"
database_name = "lupaux"
database_id = "REEMPLAZAR_CON_DATABASE_ID"
migrations_dir = "migrations"

# --- Producción (rama main) ---
# Los bindings no se heredan entre entornos: hay que repetir D1 acá.
[env.production.vars]
AUTH_MODE = "access"
ACCESS_TEAM_DOMAIN = "https://tight-forest-2b64.cloudflareaccess.com"
ACCESS_AUD = "1bc8e4aad1fce1a0ecb9b9af4004346d9fd1f10105b0cb444c74bb47bee2da79"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lupaux"
database_id = "9f07f91f-4ffd-4bff-ade2-f280b022dfc9"
migrations_dir = "migrations"

# --- Previews (otras ramas) ---
# Mismo candado que producción, pero base APARTE: una rama nunca toca datos reales.
[env.preview.vars]
AUTH_MODE = "access"
ACCESS_TEAM_DOMAIN = "https://tight-forest-2b64.cloudflareaccess.com"
ACCESS_AUD = "1bc8e4aad1fce1a0ecb9b9af4004346d9fd1f10105b0cb444c74bb47bee2da79"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "lupaux-preview"
database_id = "bccf1f61-6767-4d41-92b0-02100ae6adae"
migrations_dir = "migrations"
