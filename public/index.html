function normalizePropuesta(p){
  if(!p||typeof p!=="object")return p;
  if(p.tipo!=="mensual"&&p.tipo!=="fixed")p.tipo="fixed";
  if(p.precioModo!=="monto"&&p.precioModo!=="adefinir")p.precioModo="adefinir";

  if(p.precio===undefined)p.precio=null;

  PROP_DESC.forEach(([k])=>{ if(!(k in p.descuentos))p.descuentos[k]=null; });
  if(!p.lanz||typeof p.lanz!=="object")p.lanz={on:false,pct:20};
  if(p.lanz.pct==null||p.lanz.pct==="")p.lanz.pct=20;

}
/* Precio de lanzamiento: el precio guardado YA tiene el descuento aplicado.
   El "antes" se deriva y se redondea a múltiplos de 5. */
function propLaunch(p){
  if(!p.lanz||!p.lanz.on)return null;
  if(p.precioModo==="adefinir"||p.precio==null||p.precio==="")return null;
  const pct=Number(p.lanz.pct||0); if(pct<=0||pct>=100)return null;
  const antes=Math.round((Number(p.precio)/(1-pct/100))/5)*5;
  if(antes<=Number(p.precio))return null;
  return {antes,pct};
}
function propPriceLine(p){
  if(p.precioModo==="adefinir"||p.precio==null||p.precio==="")return "A definir";
  return propMoney(p.moneda,p.precio)+(p.tipo==="mensual"?" /mes":"");
}
function propDiscRows(p){
  const d=p.descuentos||{}, rows=[];
  const base=(p.precioModo!=="adefinir"&&p.precio!=null&&p.precio!=="")?Number(p.precio):null;
  PROP_DESC.forEach(([k,label,mult])=>{
    const pct=d[k];
    if(pct==null||pct===""||Number(pct)<=0)return;
    let extra="";
    if(base!=null&&p.tipo==="mensual"){
      const total=base*mult*(1-Number(pct)/100);
      extra=" · "+propMoney(p.moneda,total)+(mult>1?" ("+propMoney(p.moneda,total/mult)+"/mes)":"");
    }
    rows.push({label,pct:Number(pct),extra});
  });
  return rows;
}
/* Builder de tarjeta de propuesta (reporte del cliente en la app).
   escFn/paraFn se inyectan para poder replicar la misma vista en la página autónoma. */
function propuestaCardHTML(p,escFn,paraFn){
  const E=escFn||esc, PA=paraFn||paraHTML;
  const rows=propDiscRows(p);
  const disc=rows.length?`<div class="cr-prop-disc"><b>Descuentos por pago adelantado</b><ul>${rows.map(r=>`<li><span>${E(r.label)}</span><span>-${r.pct}%${r.extra?E(r.extra):""}</span></li>`).join("")}</ul></div>`:"";
  const incl=(p.bullets&&p.bullets.length)?`<ul>${p.bullets.map(x=>`<li>${E(x)}</li>`).join("")}</ul>`:"";
  const L=propLaunch(p);
  const priceHTML=L
    ? `<div class="cr-prop-price has-launch"><span class="cr-prop-was">${E(propMoney(p.moneda,L.antes)+(p.tipo==="mensual"?" /mes":""))}</span><span class="cr-prop-now">${E(propPriceLine(p))}</span><span class="cr-prop-launch">Lanzamiento -${L.pct}%</span></div><div class="cr-prop-urg">Precio de lanzamiento por tiempo limitado. Reservás este valor al confirmar el servicio.</div>`
    : `<div class="cr-prop-price">${E(propPriceLine(p))}</div>`;
  return `<div class="cr-prop"><div class="cr-prop-top"><h4>${E(p.titulo)}</h4><span class="cr-prop-tag">${E(propTipoLabel(p.tipo))}</span></div>
    ${priceHTML}
    <div class="cr-prose">${PA(p.texto)}${incl}</div>${disc}</div>`;
}

function renderPropList(est,c){
  const r=est.reporte, box=c.querySelector("#rptPropList");
  const n=r.propuestas.length;
  box.innerHTML=n?r.propuestas.map((p,i)=>{
    const price=p.precioModo==="adefinir"?"a definir":propPriceLine(p);
    return `<div class="rpt-item" data-i="${i}" draggable="true"><span class="ri-grip" title="Arrastrar para reordenar" style="cursor:grab;color:var(--faint);flex:none;margin-right:2px">${gripIco()}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.titulo||"(sin título)")} <span style="color:var(--faint);font-family:var(--mono);font-size:11px">· ${esc(price)}</span></span><span class="ri-acts"><button class="icon-btn sm u" style="width:26px;height:26px" title="Subir" ${i===0?"disabled":""}>${chevUp()}</button><button class="icon-btn sm dn" style="width:26px;height:26px" title="Bajar" ${i===n-1?"disabled":""}>${chevDown()}</button><button class="icon-btn sm e" style="width:26px;height:26px" title="Editar">${pencil()}</button><button class="icon-btn sm d" style="width:26px;height:26px" title="Eliminar">${trash()}</button></span></div>`;
  }).join(""):`<span class="rhint">Sin propuestas.</span>`;
  const refresh=()=>{ saveReporte(est); renderPropList(est,c); if(window._rptSchedule)window._rptSchedule(); };
  const move=(i,j)=>{ if(j<0||j>=r.propuestas.length)return; const a=r.propuestas; const t=a[i]; a.splice(i,1); a.splice(j,0,t); refresh(); };
  box.querySelectorAll(".rpt-item").forEach(it=>{
    const i=+it.dataset.i;
    it.querySelector(".e").onclick=()=>propuestaModal(est,i);
    it.querySelector(".d").onclick=()=>{r.propuestas.splice(i,1);refresh();};
    it.querySelector(".u").onclick=()=>move(i,i-1);
    it.querySelector(".dn").onclick=()=>move(i,i+1);
    it.ondragstart=e=>{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",String(i)); it.style.opacity=".45"; };
    it.ondragend=()=>{ it.style.opacity=""; };
    it.ondragover=e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move"; it.style.borderColor="var(--accent)"; };
    it.ondragleave=()=>{ it.style.borderColor=""; };
    it.ondrop=e=>{ e.preventDefault(); it.style.borderColor=""; const from=+e.dataTransfer.getData("text/plain"); if(!isNaN(from)&&from!==i)move(from,i); };
  });
}

async function getDownloads(){
  if(window.claude&&window.claude.use){ try{ return await window.claude.use("downloads"); }catch(e){ return null; } }
  // Sin runtime de Claude (self-hosted): descarga nativa del navegador.
  return { save: async ({filename,data})=>{
    let blob;
    if(data instanceof Blob) blob=data;
    else if(data instanceof ArrayBuffer || ArrayBuffer.isView(data)) blob=new Blob([data]);
    else blob=new Blob([String(data)],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=filename||"descarga"; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
    return {status:"saved"};
  }};
}

/* ---- Exportar en texto plano ---- */
function plainReport(est){
  const r=ensureReporte(est), m=marcaActual(), hz=state.hallazgos;
  const bar="=".repeat(64), sub="-".repeat(64);
  const L=[]; const P=s=>L.push(s);
  const linesFmt=(t,pre)=>{ const l=linesOf(t); l.forEach(x=>P((pre||"- ")+x)); return l.length; };
  function fmtHz(h,indent,lead){
    const p=indent||"";
    const sev=(h.severidad!=null&&h.severidad!=="")?("Sev "+h.severidad+" · "+SEVERIDAD[h.severidad].label):"sin severidad";
    P(p+(lead||"")+"["+(h.tipo||"Hallazgo")+" · "+sev+"] "+(h.titulo||"(sin título)"));
    if(h.pantalla)P(p+"  Pantalla/paso: "+h.pantalla);
    const heur=(h.heuristicas||[]).map(id=>{const x=heurById(id);return x?x.nombre:null;}).filter(Boolean);
    if(heur.length)P(p+"  Heurísticas: "+heur.join(", "));
    const ses=(h.sesgos||[]).map(id=>{const x=sesgoById(id);return x?x.nombre:null;}).filter(Boolean);
    if(ses.length)P(p+"  Sesgos / patrones: "+ses.join(", "));
    if(h.descripcion)P(p+"  Descripción: "+h.descripcion);
    if(h.recomendacion)P(p+"  Recomendación: "+h.recomendacion);
    if(h.tags&&h.tags.length)P(p+"  Etiquetas: "+h.tags.join(", "));
  }
  // Encabezado
  P(bar); P("INFORME DE EXPERIENCIA DE USUARIO"); P((est.nombre||"").toUpperCase()); P(bar); P("");
  // Datos del estudio
  P("DATOS DEL ESTUDIO");
  if(est.cliente)P("- Cliente: "+est.cliente);
  if(est.plataforma)P("- Plataforma: "+est.plataforma);
  if(est.url)P("- URL / referencia: "+est.url);
  if(est.estado)P("- Estado: "+est.estado);
  if(est.fecha)P("- Fecha: "+est.fecha);
  if(est.descripcion)P("- Descripción / alcance: "+est.descripcion);
  P("");
  P("MARCA");
  P("- Autor: "+m.nombre); P("- Rol: "+m.rol); P("- Sitio: "+m.sitio); P("- Año: "+m.anio);
  P("");
  P("TÍTULO DEL INFORME"); P(r.subtitulo||"(sin subtítulo)"); P("");
  // Resumen ejecutivo
  P(sub); P("1. RESUMEN EJECUTIVO"); P(sub);
  if(r.resumen)P(r.resumen);
  const byT=t=>hz.filter(h=>h.tipo===t).length, sevN=n=>hz.filter(h=>h.tipo==="Problema"&&h.severidad===n).length;
  P(""); P("Métricas:");
  P("- Total de hallazgos: "+hz.length);
  P("- Problemas: "+byT("Problema"));
  P("- Oportunidades: "+byT("Oportunidad"));
  P("- Observaciones: "+byT("Observación"));
  P("- Severidad alta (3-4): "+(sevN(3)+sevN(4)));
  P(""); P("1.1 Objetivos"); if(!linesFmt(r.objetivos))P("(sin objetivos cargados)");
  P(""); P("1.2 Alcance"); if(!linesFmt(r.alcance))P("(sin alcance cargado)");
  P(""); P("1.3 Métricas y metas"); if(!linesFmt(r.metricas))P("(sin métricas cargadas)");
  P("");
  // Protopersonas
  P(sub); P("2. PROTOPERSONAS"); P(sub);
  if(!r.protopersonas.length)P("(sin protopersonas)");
  r.protopersonas.forEach((p,i)=>{
    P(""); P("Protopersona "+(i+1)+": "+(p.nombre||"")+(p.edad?", "+p.edad:""));
    if(p.titulo)P("Arquetipo: "+p.titulo);
    if(p.ubicacion)P("Ubicación: "+p.ubicacion);
    if(p.ocupacion)P("Ocupación: "+p.ocupacion);
    if(p.bio)P("Bio: "+p.bio);
    if(p.necesidades&&p.necesidades.length){ P("Necesidades:"); p.necesidades.forEach(x=>P("- "+x)); }
    if(p.objetivos&&p.objetivos.length){ P("Objetivos:"); p.objetivos.forEach(x=>P("- "+x)); }
    if(p.dolores&&p.dolores.length){ P("Dolores / problemas:"); p.dolores.forEach(x=>P("- "+x)); }
  });
  P("");
  // Evaluación heurística por flujo
  P(sub); P("3. EVALUACIÓN HEURÍSTICA (por flujo)"); P(sub);
  const refIds=new Set();
  const flowsOnly=state.flujos.filter(f=>f.tipo!=="User Journey");
  if(!flowsOnly.length)P("(no hay user flows en este estudio)");
  flowsOnly.forEach(f=>{
    P(""); P("FLUJO: "+(f.nombre||"")+"  ["+(f.tipo||"User Flow")+"]");
    if(f.descripcion)P("Descripción: "+f.descripcion);
    const nodes=(f.nodes||[]);
    if(!nodes.length){ P("  (sin pantallas)"); return; }
    nodes.forEach((n,ni)=>{
      P(""); P("  Pantalla "+(ni+1)+": "+(n.titulo||"Interacción"));
      if(n.ve)P("  Ve: "+n.ve);
      if(n.hace)P("  Hace: "+n.hace);
      const ms=(n.markers||[]).map(mk=>findHz(mk.hallazgoId)).filter(Boolean);
      if(ms.length){ P("  Hallazgos:"); ms.forEach(h=>{ refIds.add(h.id); fmtHz(h,"    "); }); }
      else P("  Hallazgos: (ninguno marcado en esta pantalla)");
    });
  });
  const otros=hz.filter(h=>!refIds.has(h.id));
  if(otros.length){ P(""); P("HALLAZGOS SIN PANTALLA VINCULADA"); otros.forEach(h=>{ P(""); fmtHz(h,"  "); }); }
  P("");
  // User Journeys
  const journeys=state.flujos.filter(f=>f.tipo==="User Journey");
  if(journeys.length){
    P(sub); P("MAPA DE EXPERIENCIA — USER JOURNEYS"); P(sub);
    journeys.forEach(j=>{
      P(""); P("JOURNEY: "+(j.nombre||"")); if(j.descripcion)P("Escenario: "+j.descripcion);
      const cs=j.carriles||{};
      (j.pasos||[]).forEach((p,i)=>{
        const et=(j.etapas||[]).find(e=>e.id===p.etapaId);
        const arrOf=v=>Array.isArray(v)?v:(v?[String(v)]:[]);
        const jp=(f,lbl)=>{ const v=arrOf(p[f]); if(v.length)P("    "+lbl+": "+v.join(" · ")); };
        P(""); P("  Paso "+(i+1)+": "+(p.nombre||"")+(et?"   [Etapa: "+et.nombre+"]":""));
        if(cs.touchpoint!==false){ const tp=[]; if(p.touchpoint)tp.push(p.touchpoint); const tpp=arrOf(p.tpPills); if(tpp.length)tp.push(tpp.join(" · ")); if(tp.length)P("    Touchpoint: "+tp.join("  |  ")); }
        if(cs.emocion!==false)P("    Emocionalidad: "+EMO[(p.emocion!=null?p.emocion:2)].label);
        if(cs.acciones!==false)jp("acciones","Acciones");
        if(cs.expectativas!==false)jp("expectativas","Expectativas / pensamiento");
        if(cs.pain!==false)jp("pain","Pain points");
        if(cs.oportunidades!==false)jp("oportunidades","Oportunidades");
      });
    });
    P("");
  }
  // Diagnóstico
  P(sub); P("4. DIAGNÓSTICO ESTRATÉGICO"); P(sub);
  if(r.diagIntro)P(r.diagIntro);
  P(""); P("4.1 Hallazgos clave");
  if(!r.hallazgosClave.length)P("(sin hallazgos clave)");
  r.hallazgosClave.forEach(b=>{ P(""); P("• "+(b.titulo||"")); if(b.texto)P("  "+b.texto.replace(/\n/g,"\n  ")); });
  P(""); P("4.2 Recomendaciones prioritarias");
  if(!r.recomendaciones.length)P("(sin recomendaciones)");
  r.recomendaciones.forEach(b=>{
    P(""); P("• "+(b.titulo||"")); if(b.texto)P("  "+b.texto.replace(/\n/g,"\n  "));
    if(b.bullets&&b.bullets.length){ P("  Acciones:"); b.bullets.forEach(x=>P("  - "+x)); }
    if(b.impacto)P("  Impacto esperado: "+b.impacto);
  });
  P("");
  // Propuestas de trabajo
  P(sub); P("5. PROPUESTAS DE TRABAJO"); P(sub);
  if(!r.propuestas.length)P("(sin propuestas)");
  r.propuestas.forEach((p,i)=>{
    normalizePropuesta(p);
    P(""); P((i+1)+". "+(p.titulo||"")+"   ["+propTipoLabel(p.tipo)+"]");
    const L=propLaunch(p);
    if(L){ P("   Precio de lanzamiento (-"+L.pct+"%): "+propPriceLine(p)+"   (antes "+propMoney(p.moneda,L.antes)+(p.tipo==="mensual"?" /mes":"")+")"); }
    else P("   Precio: "+propPriceLine(p));
    if(p.texto)P("   "+p.texto.replace(/\n/g,"\n   "));
    if(p.bullets&&p.bullets.length){ P("   Incluye:"); p.bullets.forEach(x=>P("   - "+x)); }
    const dr=propDiscRows(p);
    if(dr.length){ P("   Descuentos por pago adelantado:"); dr.forEach(d=>P("   - "+d.label+": "+d.pct+"%"+(d.extra?d.extra.replace(/·/g,"->"):""))); }
  });
  P("");
  // Listado completo
  P(sub); P("LISTADO COMPLETO DE HALLAZGOS"); P(sub);
  if(!hz.length)P("(sin hallazgos)");
  const order={Problema:0,Oportunidad:1,"Observación":2};
  [...hz].sort((a,b)=>(order[a.tipo]-order[b.tipo])||((b.severidad??-1)-(a.severidad??-1))).forEach((h,i)=>{ P(""); fmtHz(h,"",(i+1)+". "); });
  P(""); P(bar); P("Generado con Lupa UX · "+m.sitio); P(bar);
  return L.join("\n");
}

function SR_boot(D){
  const root=document.getElementById("shareRoot"); if(!root)return;

  const linesOf=t=>String(t||"").split("\n").map(s=>s.replace(/^[-•]\s*/,"").trim()).filter(Boolean);
  const bullets=t=>{const l=linesOf(t);if(!l.length)return"";if(l.length===1)return"<p>"+esc(l[0])+"</p>";return"<ul>"+l.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";};
  const para=t=>String(t||"").split(/\n{2,}/).map(p=>p.trim()).filter(Boolean).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");
  const PROP_DESC=[["mensual","Pago mensual",1],["trimestral","Trimestral (3 meses)",3],["semestral","Semestral (medio año)",6],["anual","Anual (12 meses)",12]];
  const MSYM={USD:"US$",ARS:"$",EUR:"€"};

  const priceLine=p=>(p.precioModo==="adefinir"||p.precio==null||p.precio==="")?"A definir":money(p.moneda,p.precio)+(p.tipo==="mensual"?" /mes":"");

    const disc=rows.length?'<div class="cr-prop-disc"><b>Descuentos por pago adelantado</b><ul>'+rows.map(r=>'<li><span>'+esc(r.label)+'</span><span>-'+r.pct+'%'+(r.ex?esc(r.ex):"")+'</span></li>').join("")+'</ul></div>':"";

    return '<div class="cr-prop"><div class="cr-prop-top"><h4>'+esc(p.titulo)+'</h4><span class="cr-prop-tag">'+esc(p.tipo==="mensual"?"Plan fijo mensual":"Precio fijo")+'</span></div>'+priceHTML+'<div class="cr-prose">'+para(p.texto)+incl+'</div>'+disc+'</div>';
  }
  const SEV=[{l:"No es problema"},{l:"Cosmético"},{l:"Menor"},{l:"Mayor"},{l:"Catástrofe"}];

async function collectShareData(est){
  const r=ensureReporte(est), m=marcaActual();
  const flows=state.flujos.filter(f=>f.tipo!=="User Journey"), journeys=state.flujos.filter(f=>f.tipo==="User Journey");
  const hzOut=[];
  for(const h of state.hallazgos){
    const imgs=[];
    for(const im of (h.imgs||[])){ try{ const d=await store.getImg(est.id,h.id,im.id); if(d){ const url=await compositeDataUrl(d,0.82); const pins=(d.ann||[]).filter(a=>a.t==="pin").sort((a,b)=>(a.n||0)-(b.n||0)).map(p=>({n:p.n,color:p.color||"#e2483d",comment:p.comment||""})); imgs.push({url,pins}); } }catch(e){} }
    hzOut.push({ id:h.id, tipo:h.tipo, severidad:(h.severidad!=null&&h.severidad!=="")?h.severidad:null, titulo:h.titulo||"", pantalla:h.pantalla||"", descripcion:h.descripcion||"", recomendacion:h.recomendacion||"", heur:(h.heuristicas||[]).map(id=>{const x=heurById(id);return x?x.nombre:null;}).filter(Boolean), sesgos:(h.sesgos||[]).map(id=>{const x=sesgoById(id);return x?x.nombre:null;}).filter(Boolean), tags:h.tags||[], imgs });
  }
  const flowsOut=[];
  for(const f of flows){ const nodes=[];
    for(const n of (f.nodes||[])){ let full=null; if(n.imgId){ try{ const d=await flowStore.getImg(est.id,f.id,n.imgId); if(d)full=d.full; }catch(e){} }
      nodes.push({ id:n.id, titulo:n.titulo||"", ve:n.ve||"", hace:n.hace||"", x:n.x||0, y:n.y||0, thumb:n.imgThumb||null, full, markers:(n.markers||[]).map(mk=>({x:mk.x,y:mk.y,hallazgoId:mk.hallazgoId})) }); }
    flowsOut.push({ id:f.id, nombre:f.nombre||"", descripcion:f.descripcion||"", nodes, edges:(f.edges||[]).map(e=>({from:e.from,to:e.to,tipo:e.tipo,label:e.label||""})) });
  }
  const jOut=journeys.map(j=>{ (j.pasos||[]).forEach(jrNormalizePaso); return { id:j.id, nombre:j.nombre||"", descripcion:j.descripcion||"", etapas:j.etapas||[], carriles:j.carriles||jrDefaultCarriles(), pasos:(j.pasos||[]).map(p=>({nombre:p.nombre,etapaId:p.etapaId,emocion:(p.emocion!=null?p.emocion:2),touchpoint:p.touchpoint||"",tpPills:p.tpPills||[],acciones:p.acciones||[],expectativas:p.expectativas||[],pain:p.pain||[],oportunidades:p.oportunidades||[]})) }; });
  const hz=state.hallazgos, byT=t=>hz.filter(x=>x.tipo===t).length, sevN=n=>hz.filter(x=>x.tipo==="Problema"&&x.severidad===n).length;
  return {
    brand:{wordmark:m.wordmark,headerImg:m.headerImg||null,nombre:m.nombre,rol:m.rol,sitio:m.sitio,email:m.email||"",tel:m.tel||"",servicioNombre:m.servicioNombre||"",servicioDesc:m.servicioDesc||"",servicioUrl:m.servicioUrl||""},
    est:{nombre:est.nombre||"",cliente:est.cliente||"",plataforma:est.plataforma||"",fecha:est.fecha||""},
    report:{resumen:r.resumen||"",objetivos:r.objetivos||"",alcance:r.alcance||"",diagIntro:r.diagIntro||"",muestra:r.muestra||{on:false,texto:""},online:r.online||{},propuestas:r.propuestas||[],hallazgosClave:r.hallazgosClave||[],recomendaciones:r.recomendaciones||[],protopersonas:r.protopersonas||[]},
    metrics:{total:hz.length,problemas:byT("Problema"),oportunidades:byT("Oportunidad"),sevAlta:sevN(3)+sevN(4)},
    hallazgos:hzOut, flows:flowsOut, journeys:jOut
  };

/* ============ Respaldo: exportar / importar ============ */
/* Formato: {app:"lupaux", version:1, exportedAt, docs:[{path,data}]}. Sirve para
   pasar datos de IndexedDB (un navegador) al servidor, o entre equipos. Usa solo
   la API de DB (dumpAll + doc().set), así funciona igual con cualquier backend. */
async function exportAllData(btn){
  try{
    if(btn)btn.disabled=true;
    const docs=await DB.dumpAll();
    const payload=JSON.stringify({app:"lupaux",version:1,exportedAt:new Date().toISOString(),docs});
    const dl=await getDownloads();
    const fecha=new Date().toISOString().slice(0,10);
    await dl.save({filename:"lupaux-respaldo-"+fecha+".json",data:new Blob([payload],{type:"application/json"})});
    toast("Respaldo exportado ("+docs.length+" documentos)");
  }catch(e){ toast("No se pudo exportar: "+e.message); }
  finally{ if(btn)btn.disabled=false; }
}
function importAllData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f)return;
    let j;
    try{ j=JSON.parse(await f.text()); }catch(e){ toast("El archivo no es un JSON válido"); return; }
    if(!j||j.app!=="lupaux"||!Array.isArray(j.docs)){ toast("El archivo no es un respaldo de Lupa UX"); return; }
    if(!confirm("Se van a importar "+j.docs.length+" documentos. Los que ya existan con la misma ruta se reemplazan. ¿Continuar?"))return;
    let ok=0, fail=0; const queue=j.docs.slice();
    const worker=async()=>{ while(queue.length){ const d=queue.shift(); if(!d||typeof d.path!=="string")continue; try{ await DB.doc(d.path).set(d.data||{}); ok++; }catch(e){ fail++; } } };
    toast("Importando…");
    await Promise.all([worker(),worker(),worker(),worker()]);
    state.estudios=await store.listEstudios(); state.marca=await brandStore.get();
    state.customHeur=await store.listCustom("heur"); state.customSesgos=await store.listCustom("sesgo");
    render();
    toast(fail?("Importados "+ok+", fallaron "+fail):("Importados "+ok+" documentos"));
  };
  inp.click();
}
// Un guardado que falla (sin conexión, sesión vencida, documento muy grande) no
// debe pasar en silencio: lo mostramos como aviso.
window.addEventListener("unhandledrejection",e=>{ const m=e.reason&&e.reason.message; if(m&&DB_MODE==="server")toast(m); });

/* ============ Init ============ */
async function init(){
  initTheme();
  document.getElementById("brandBtn").onclick=goHome;
  try{ const db = window.claude && window.claude.use && await window.claude.use("db"); if(db){DB=db;USE_DB=true;DB_MODE="claude";} }catch(e){}
  // Hosteado con backend (Cloudflare Pages + D1): si /api/health responde, usamos el servidor.
  // Solo caemos a IndexedDB si la API NO existe (404 o respuesta que no es JSON, típico
  // de un hosting estático). Si la API existe pero falla, mostramos el error: guardar
  // en el navegador creyendo que es el servidor partiría los datos en dos lugares.
  if(!USE_DB && /^https?:$/.test(location.protocol)){
    let apiErr=null;
    try{
      const r=await fetch("api/health",{credentials:"same-origin",cache:"no-store",signal:AbortSignal.timeout(6000)});
      const isJson=(r.headers.get("content-type")||"").includes("application/json");
      if(r.ok&&isJson){ DB=makeHTTPAdapter("api"); USE_DB=true; DB_MODE="server"; }
      else if(isJson){ const j=await r.json().catch(()=>({})); apiErr=j.error||("Error "+r.status); }
    }catch(e){ apiErr="No se pudo contactar al servidor. Revisá la conexión."; }
    if(apiErr){
      view.innerHTML=`<div class="empty"><h3>El servidor no está disponible</h3><p>${esc(apiErr)}</p><button class="btn primary" onclick="location.reload()">Reintentar</button></div>`;
      return;
    }
  }
  // Sin backend (archivo local u hosting estático): IndexedDB del navegador.
  if(!USE_DB && window.indexedDB){ try{ const idb=makeIDBAdapter(); await idb.ready(); DB=idb; USE_DB=true; DB_MODE="idb"; }catch(e){} }
  const badge=document.getElementById("localBadge");
  badge.classList.toggle("hidden",DB_MODE==="claude");
  if(DB_MODE==="server"){ badge.textContent="servidor"; badge.title="Los datos se guardan en la base de datos del servidor"; }
  if(DB_MODE==="none"){ badge.textContent="almacenamiento limitado"; badge.title="IndexedDB no está disponible en este navegador: se usa localStorage (~5 MB, las imágenes pueden no entrar)"; }
  try{ state.customHeur=await store.listCustom("heur"); state.customSesgos=await store.listCustom("sesgo"); }catch(e){}
  // Router del reporte online. Robusto ante el redirect del visor (el hash
  // puede llegar unos ms después de que arranca el script), por eso ademas
  // del chequeo inicial escuchamos hashchange y hacemos un poll corto.
  const routeReport=()=>{ const id=parseReportHash(); if(id && !document.getElementById("clientRoot")){ openClientReport(id,{}); return true; } return false; };
  window.addEventListener("hashchange",routeReport);
  if(parseReportHash()){ routeReport(); return; }
  // carga normal (workspace)
  try{
    state.estudios=await store.listEstudios();
    state.marca=await brandStore.get();
  }catch(e){
    view.innerHTML=`<div class="empty"><h3>No se pudieron cargar los datos</h3><p>${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Reintentar</button></div>`;
    return;
  }
  state.view="home";
  render();
  // por si el hash del reporte aparece luego del redirect
  let tries=0; const iv=setInterval(()=>{ tries++; if(routeReport()||tries>16)clearInterval(iv); },250);
}
init();
</script>
