<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lupa UX — herramienta de diagnóstico y evaluación heurística de UX.">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>Lupa UX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===== Tema base: shadcn/ui (neutral). Reemplazá los valores de este bloque
   por los del preset buFywKm cuando pegues su CSS (:root y .dark). ===== */
:root{
  --radius:0.625rem; --radius-sm:0.5rem;
  /* tokens shadcn */
  --background:oklch(1 0 0); --foreground:oklch(0.145 0 0);
  --card:oklch(1 0 0); --primary:oklch(0.205 0 0); --primary-fg:oklch(0.985 0 0);
  --secondary:oklch(0.97 0 0); --border:oklch(0.922 0 0); --input:oklch(0.922 0 0); --ring:oklch(0.708 0 0);
  /* mapeo a los nombres usados por los componentes */
  --ground:oklch(0.985 0 0); --surface:var(--card); --surface-2:oklch(0.967 0 0);
  --ink:var(--foreground); --muted:oklch(0.556 0 0); --faint:oklch(0.646 0 0);
  --line:var(--border); --line-strong:oklch(0.87 0 0);
  --accent:var(--primary); --accent-strong:oklch(0.145 0 0); --accent-soft:oklch(0.967 0 0);
  --sev0:#8b95a5; --sev1:#5b8def; --sev2:#d99a2b; --sev3:#e0703a; --sev4:#e5484d;
  --prob:#e5484d; --prob-soft:#fdecec;
  --opor:#12a594; --opor-soft:#e4f5f2;
  --obs:#64748b; --obs-soft:#eef1f5;
  --shadow:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-lg:0 10px 30px -6px rgb(0 0 0 / .18), 0 4px 10px -4px rgb(0 0 0 / .12);
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --background:oklch(0.145 0 0); --foreground:oklch(0.985 0 0);
    --card:oklch(0.205 0 0); --primary:oklch(0.922 0 0); --primary-fg:oklch(0.205 0 0);
    --secondary:oklch(0.269 0 0); --border:oklch(1 0 0 / 12%); --input:oklch(1 0 0 / 18%); --ring:oklch(0.556 0 0);
    --ground:oklch(0.145 0 0); --surface:var(--card); --surface-2:oklch(0.269 0 0);
    --ink:var(--foreground); --muted:oklch(0.708 0 0); --faint:oklch(0.556 0 0);
    --line:var(--border); --line-strong:oklch(1 0 0 / 22%);
    --accent:var(--primary); --accent-strong:oklch(0.985 0 0); --accent-soft:oklch(0.269 0 0);
    --sev0:#6b7787; --sev1:#6b96e6; --sev2:#e0aa4a; --sev3:#e8814f; --sev4:#f0666b;
    --prob:#f0666b; --prob-soft:#2b1c1e;
    --opor:#3ec9b6; --opor-soft:#132a27;
    --obs:#94a3b8; --obs-soft:#1c2530;
    --shadow:0 1px 2px 0 rgb(0 0 0 / .35);
    --shadow-lg:0 10px 34px -6px rgb(0 0 0 / .55), 0 4px 10px -4px rgb(0 0 0 / .4);
  }
}
:root[data-theme="dark"]{
  --background:oklch(0.145 0 0); --foreground:oklch(0.985 0 0);
  --card:oklch(0.205 0 0); --primary:oklch(0.922 0 0); --primary-fg:oklch(0.205 0 0);
  --secondary:oklch(0.269 0 0); --border:oklch(1 0 0 / 12%); --input:oklch(1 0 0 / 18%); --ring:oklch(0.556 0 0);
  --ground:oklch(0.145 0 0); --surface:var(--card); --surface-2:oklch(0.269 0 0);
  --ink:var(--foreground); --muted:oklch(0.708 0 0); --faint:oklch(0.556 0 0);
  --line:var(--border); --line-strong:oklch(1 0 0 / 22%);
  --accent:var(--primary); --accent-strong:oklch(0.985 0 0); --accent-soft:oklch(0.269 0 0);
  --sev0:#6b7787; --sev1:#6b96e6; --sev2:#e0aa4a; --sev3:#e8814f; --sev4:#f0666b;
  --prob:#f0666b; --prob-soft:#2b1c1e;
  --opor:#3ec9b6; --opor-soft:#132a27;
  --obs:#94a3b8; --obs-soft:#1c2530;
  --shadow:0 1px 2px 0 rgb(0 0 0 / .35);
  --shadow-lg:0 10px 34px -6px rgb(0 0 0 / .55), 0 4px 10px -4px rgb(0 0 0 / .4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;line-height:1.15;text-wrap:balance}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
input:focus,select:focus,textarea:focus,.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 35%,transparent)}

/* Layout */
.app{max-width:none;margin:0;padding:0 clamp(16px,3vw,40px) 80px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0 clamp(16px,3vw,40px)}
.top-in{max-width:none;margin:0;display:flex;align-items:center;gap:8px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;background:none;border:none;padding:0;color:var(--ink);cursor:pointer}
.brand .glass{width:26px;height:26px;flex:none;color:var(--accent)}
.brand small{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;padding-top:3px}
.topnav{display:flex;gap:2px;margin-left:12px}
.topnav button{background:none;border:none;padding:8px 13px;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer;font-size:14px}
.topnav button:hover{color:var(--ink);background:var(--surface-2)}
.topnav button.on{color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1}
.badge-local{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;letter-spacing:.04em}
.icon-btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--faint)}
.icon-btn:disabled{opacity:.32;cursor:default;pointer-events:none}

/* Encabezado de estudio + submenú */
.study-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:22px 0 18px;flex-wrap:wrap}
.sh-main{display:flex;gap:14px;align-items:flex-start}
.study-head .back{align-self:flex-start;margin-top:3px}
.sh-title h2{font-size:24px;letter-spacing:-.02em}
.sh-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:13px}
.sh-meta .who{font-weight:500;color:var(--ink)}
.sh-meta .url{font-family:var(--mono);font-size:11.5px;color:var(--accent);text-decoration:none;word-break:break-all}
.sh-meta .url:hover{text-decoration:underline}
.subtabs{display:flex;gap:2px;margin:0 0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:none;padding:11px 16px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px;cursor:pointer}
.subtabs button:hover{color:var(--ink)}
.subtabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.subtabs .cnt{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.tab-actions{display:flex;align-items:center;margin-bottom:18px}
.soon-empty .soon-badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);background:var(--accent-soft);border-radius:20px;padding:3px 10px;margin-bottom:12px}

/* Section head */
.sec-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sec-head .t h2{font-size:24px;letter-spacing:-.02em}
.sec-head .t p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:60ch}
.sec-head .spacer{flex:1}

/* Buttons */
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);padding:9px 15px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--primary-fg)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:7px 10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger:hover{border-color:var(--prob);color:var(--prob)}

/* Cards grid */
.grid{display:grid;gap:14px}
.grid.studies{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

.study-card{padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.14s;position:relative}
.study-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.study-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.study-card .open-area{display:flex;flex-direction:column;gap:12px;flex:1;cursor:pointer}
.study-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.study-card .top-row .chev{color:var(--faint);flex:none;transition:.12s}
.study-card:hover .top-row .chev{color:var(--accent);transform:translateX(2px)}
.study-card h3{font-size:17px;letter-spacing:-.01em}
.study-card .client{color:var(--muted);font-size:13px;margin-top:2px}
.study-card .url{font-family:var(--mono);font-size:11.5px;color:var(--accent);word-break:break-all}
.study-card .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.study-card .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;margin-top:auto}
.study-card .foot .stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
.study-card .foot .stat b{color:var(--ink);font-weight:500}
.study-card .actions{display:flex;gap:2px;opacity:0;transition:.12s}
.study-card:hover .actions{opacity:1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.plat{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
.chip.estado[data-e="En curso"]{background:var(--sev2);color:#fff;border-color:transparent}
.chip.estado[data-e="Terminado"]{background:var(--opor);color:#fff;border-color:transparent}
.chip.estado[data-e="Planificado"]{background:var(--surface-2)}
:root[data-theme="dark"] .chip.estado[data-e="En curso"],:root:not([data-theme="light"]) .chip.estado[data-e="En curso"]{color:#1a1206}
:root[data-theme="dark"] .chip.estado[data-e="Terminado"],:root:not([data-theme="light"]) .chip.estado[data-e="Terminado"]{color:#07201f}

/* Catalogo */
.cat-controls{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface)}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;padding:7px 13px;font-size:13px;color:var(--muted);font-weight:500}
.pill.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.cat-block{margin-bottom:34px}
.cat-block > h3{font-size:13px;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.cat-block > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.cat-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

.heur{padding:16px;display:flex;gap:13px;align-items:flex-start}
.heur .num{font-family:var(--display);font-weight:700;font-size:15px;width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong)}
.heur.custom .num{background:var(--surface-2);color:var(--muted)}
.heur .body h4{font-size:15px;letter-spacing:-.01em;margin-bottom:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.heur .body p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.heur .revisar{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.heur .revisar li{font-size:12.5px;color:var(--muted);padding-left:15px;position:relative}
.heur .revisar li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.6}
.tag-src{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.heur .del{margin-left:auto;opacity:0;transition:.12s}
.heur:hover .del{opacity:1}

.sesgo{padding:15px}
.sesgo .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.sesgo h4{font-size:14.5px;letter-spacing:-.01em}
.sesgo .cat-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;flex:none;white-space:nowrap}
.sesgo .desc{color:var(--muted);font-size:13px;margin:0 0 9px}
.sesgo .apl{font-size:12.5px;background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px;border-left:2px solid var(--accent)}
.sesgo .apl b{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:2px;font-weight:500}
.cat-Ley\ de\ UX{background:#e5eef7;color:#2c5c8f}
.cat-Sesgo\ cognitivo{background:#f3e9f3;color:#834e83}
.cat-Memoria{background:#eaf2ec;color:#3f7350}
.cat-Principio{background:#f5eee4;color:#8a6a3a}
:root[data-theme="dark"] .sesgo .cat-tag,:root:not([data-theme="light"]) .sesgo .cat-tag{filter:saturate(.7) brightness(1.5)}

/* Hallazgos */
.hz-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 15px;min-width:92px}
.stat-tile .n{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1}
.stat-tile .l{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.stat-tile.sev{border-top:3px solid var(--c)}

.hz-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.hz-filters select,.hz-filters .search{padding:0}
.hz-filters select{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 10px;color:var(--muted)}

.hz-list{display:flex;flex-direction:column;gap:11px}
.hz{display:flex;gap:0;overflow:hidden}
.hz .stripe{width:5px;flex:none;background:var(--c,var(--line-strong))}
.hz .in{padding:15px 17px;flex:1;min-width:0}
.hz .r1{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.type-chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.01em}
.type-Problema{background:var(--prob-soft);color:var(--prob)}
.type-Oportunidad{background:var(--opor-soft);color:var(--opor)}
.type-Observación{background:var(--obs-soft);color:var(--obs)}
.sev-chip{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:20px;color:#fff;letter-spacing:.02em}
.hz h4{font-size:15.5px;letter-spacing:-.01em;flex:1;min-width:180px}
.hz .pantalla{font-family:var(--mono);font-size:11px;color:var(--faint)}
.hz .desc{color:var(--muted);font-size:13.5px;margin:2px 0 10px}
.hz .rels{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rel-chip{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.rel-chip.h{border-left:2px solid var(--accent)}
.rel-chip.s{border-left:2px solid #834e83}
.tag-chip{font-size:11px;color:var(--muted);font-family:var(--mono)}
.tag-chip::before{content:"#";opacity:.5}
.hz .actions{display:flex;gap:2px;align-items:flex-start;padding:12px 10px 0 0;opacity:0;transition:.12s}
.hz:hover .actions{opacity:1}

/* Empty */
.empty{text-align:center;padding:64px 24px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted)}
.empty .ico{width:44px;height:44px;color:var(--faint);margin:0 auto 14px}
.empty h3{font-size:18px;color:var(--ink);margin-bottom:6px}
.empty p{max-width:42ch;margin:0 auto 18px;font-size:14px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,32,.55);backdrop-filter:blur(3px);z-index:250;display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal.wide{max-width:680px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px}
.modal-b{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 16px 16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink)}
.field label .opt{font-weight:400;color:var(--faint);font-size:11.5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2)}
.field textarea{resize:vertical;min-height:64px;line-height:1.5}
.field .hint{font-size:11.5px;color:var(--faint)}
.hint{font-size:11.5px;color:var(--faint)}
.hint.ok{color:var(--opor)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}

/* Severity picker */
.sev-picker{display:flex;gap:6px;flex-wrap:wrap}
.sev-opt{flex:1;min-width:80px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 6px;text-align:center;background:var(--surface-2);transition:.12s}
.sev-opt .sn{font-family:var(--mono);font-weight:500;font-size:13px}
.sev-opt .sl{font-size:10.5px;color:var(--muted);margin-top:1px}
.sev-opt.on{border-color:var(--c);background:var(--c);color:#fff}
.sev-opt.on .sl{color:rgba(255,255,255,.85)}

/* multi chip select */
.multi{display:flex;flex-wrap:wrap;gap:6px;max-height:168px;overflow-y:auto;padding:2px}
.mchip{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--muted);transition:.1s}
.mchip:hover{border-color:var(--faint)}
.mchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.mchip.on.s{background:#f3e9f3;border-color:#834e83;color:#834e83}
:root[data-theme="dark"] .mchip.on.s,:root:not([data-theme="light"]) .mchip.on.s{background:#2a1f2a;color:#c99ec9}
.type-seg{display:flex;gap:6px}
.type-seg .seg{flex:1;text-align:center;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:var(--radius-sm);padding:9px;font-weight:500;font-size:13.5px;color:var(--muted)}
.type-seg .seg.on[data-t="Problema"]{background:var(--prob-soft);border-color:var(--prob);color:var(--prob)}
.type-seg .seg.on[data-t="Oportunidad"]{background:var(--opor-soft);border-color:var(--opor);color:var(--opor)}
.type-seg .seg.on[data-t="Observación"]{background:var(--obs-soft);border-color:var(--obs);color:var(--obs)}

/* Evidencia visual */
.evidencia{gap:10px}
.paste-zone{border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2);padding:16px;text-align:center;color:var(--muted);cursor:pointer;transition:.12s;display:flex;flex-direction:column;align-items:center;gap:6px}
.paste-zone:hover,.paste-zone.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.paste-zone svg{width:22px;height:22px;opacity:.75}
.paste-zone .pz-main{font-size:13.5px;font-weight:500;color:var(--ink)}
.paste-zone .pz-sub{font-size:11.5px}
.paste-zone kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:76px;height:76px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);background:var(--surface-2);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(15,22,32,.72);color:#fff;border:none;display:grid;place-items:center;opacity:0;transition:.1s;cursor:pointer}
.thumb:hover .rm{opacity:1}
.thumb .rm svg{width:11px;height:11px}
.hz-thumbs{display:flex;gap:6px;margin:2px 0 11px;flex-wrap:wrap}
.hz-thumbs .t{width:46px;height:46px;border-radius:6px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2);flex:none}
.hz-thumbs .t img{width:100%;height:100%;object-fit:cover;display:block}
.hz-thumbs .more{width:46px;height:46px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface-2);cursor:pointer;flex:none}
.lb-bg{position:fixed;inset:0;background:rgba(8,12,18,.92);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px;gap:16px}
.lb-bg img{max-width:92vw;max-height:78vh;border-radius:8px;box-shadow:0 12px 60px rgba(0,0,0,.5);object-fit:contain}
.lb-bar{display:flex;align-items:center;gap:16px;color:#fff}
.lb-bar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;cursor:pointer}
.lb-bar button:hover{background:rgba(255,255,255,.24)}
.lb-bar .cnt{font-family:var(--mono);font-size:13px;min-width:54px;text-align:center}
.lb-close{position:fixed;top:20px;right:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.lb-close:hover{background:rgba(255,255,255,.24)}
.lb-loading{color:rgba(255,255,255,.7);font-size:14px}

/* Editor de anotaciones */
.ann-bg{position:fixed;inset:0;background:var(--ground);z-index:320;display:flex;flex-direction:column}
.ann-top{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.ann-tools{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.ann-tools button{width:38px;height:34px;border:none;background:none;border-radius:7px;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.1s}
.ann-tools button:hover{color:var(--ink);background:var(--surface)}
.ann-tools button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .ann-tools button.on,:root:not([data-theme="light"]) .ann-tools button.on{color:#08201f}
.ann-colors{display:flex;gap:5px}
.ann-colors .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.ann-colors .sw.on{outline:2px solid var(--ink);outline-offset:1px}
.ann-widths{display:flex;gap:4px}
.ann-widths button{width:32px;height:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;display:grid;place-items:center;cursor:pointer}
.ann-widths button.on{border-color:var(--accent);background:var(--accent-soft)}
.ann-widths .dot{background:var(--ink);border-radius:50%;display:block}
.ann-sep{width:1px;align-self:stretch;background:var(--line);margin:3px 2px}
.ann-spacer{flex:1}
.ann-main{flex:1;display:flex;min-height:0}
.ann-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px;background:repeating-conic-gradient(var(--surface-2) 0% 25%,transparent 0% 50%) 50%/22px 22px}
.ann-stage canvas{background:#fff;box-shadow:var(--shadow-lg);border-radius:2px;touch-action:none;cursor:crosshair}
.ann-stage canvas.sel{cursor:default}
.ann-side{width:300px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.ann-side h4{padding:14px 16px 8px;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:500}
.ann-comments{flex:1;overflow-y:auto;padding:0 14px 16px;display:flex;flex-direction:column;gap:9px}
.ann-comment{display:flex;gap:8px;align-items:flex-start}
.ann-comment .pn{width:24px;height:24px;flex:none;border-radius:50%;color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;margin-top:3px}
.ann-comment textarea{flex:1;min-height:40px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;background:var(--surface-2);resize:vertical;font-size:13px;line-height:1.4}
.ann-empty{color:var(--faint);font-size:12.5px;padding:8px 2px;line-height:1.5}
.ann-inline-input{position:fixed;z-index:340;border:1px solid var(--accent);border-radius:6px;padding:4px 8px;font:600 15px/1.2 var(--sans);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);min-width:140px}
@media(max-width:720px){.ann-side{display:none}.ann-top{gap:6px}}

/* Modal de hallazgo en dos columnas */
.hz-modal{max-width:1080px;width:100%;height:92vh;display:flex;flex-direction:column}
.hz-modal .modal-b{flex:1;min-height:0;padding:0;display:flex;flex-direction:column}
.hz-2col{display:grid;grid-template-columns:minmax(300px,1fr) minmax(360px,1.15fr);flex:1;min-height:0}
.hz-left{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.hz-right{border-left:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;min-height:0}
.hz-ev-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface);min-height:52px}
.hz-strip{display:flex;gap:6px;flex:1;overflow-x:auto;align-items:center;min-height:44px}
.ev-strip-empty{font-size:12px;color:var(--faint);font-family:var(--mono)}
.ev-tab{position:relative;width:44px;height:44px;border-radius:8px;overflow:hidden;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;flex:none;padding:0}
.ev-tab.on{border-color:var(--accent)}
.ev-tab img{width:100%;height:100%;object-fit:cover;display:block}
.ev-tab .rm{position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;background:rgba(15,22,32,.72);color:#fff;display:grid;place-items:center;opacity:0;transition:.1s}
.ev-tab:hover .rm{opacity:1}
.ev-tab .rm svg{width:9px;height:9px}
.hz-ev-body{flex:1;min-height:0;display:flex;flex-direction:column}
.ev-drop{flex:1;margin:14px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);background:repeating-conic-gradient(var(--surface-2) 0% 25%,transparent 0% 50%) 50%/22px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--muted);cursor:pointer;text-align:center;padding:20px}
.ev-drop.drag{border-color:var(--accent);color:var(--accent-strong)}
.ev-drop svg{width:26px;height:26px;opacity:.7}
.ev-drop .pz-main{font-size:13.5px;font-weight:500;color:var(--ink)}
.ev-drop .pz-sub{font-size:11.5px}
.ev-drop kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink)}
.ev-loading{flex:1;display:grid;place-items:center;color:var(--faint);font-size:13px}
.ev-annotator{display:flex;flex-direction:column;height:100%;min-height:0}
.ann-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.ev-annotator .ann-stage{flex:1;min-height:130px;padding:14px}
.ev-annotator .ann-stage:focus{outline:none}
.ev-annotator .ann-comments{flex:none;max-height:190px;border-top:1px solid var(--line);padding:12px 13px}
@media(max-width:820px){
  .hz-2col{grid-template-columns:1fr;flex:none}
  .hz-left{overflow:visible}
  .hz-right{border-left:none;border-top:1px solid var(--line)}
  .hz-ev-body{min-height:440px}
  .hz-modal .modal-b{overflow-y:auto}
}

/* ===== Reportes ===== */
.rpt-wrap{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.rpt-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.rpt-toolbar .grow{flex:1;min-width:8px}
.rpt-cols2{column-width:330px;column-gap:16px}
.rpt-cols2 .rpt-group{break-inside:avoid;-webkit-column-break-inside:avoid;display:block;margin:0 0 16px;width:100%}
.rpt-side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 210px);overflow-y:auto;padding-right:4px}
.rpt-side-top{display:flex;gap:8px}
.rpt-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px}
.rpt-group>h4{font-size:13px;display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}
.rpt-group>h4 .btn{padding:3px 7px}
.rpt-checks{display:flex;flex-direction:column;gap:7px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.rpt-group textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:7px 9px;background:var(--surface-2);font-size:12.5px;line-height:1.4;resize:vertical;margin-bottom:8px}
.rlab{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;color:var(--muted);margin:2px 0 4px}
.rlab span{font-weight:400;color:var(--faint)}
.rlab .btn{padding:2px 6px}
.rhint{font-size:11.5px;color:var(--faint);line-height:1.4}
.rpt-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.rpt-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 5px 4px 10px;font-size:12.5px}
.rpt-item>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-acts{display:flex;gap:2px;flex:none}
.rpt-preview{position:sticky;top:74px}
.rpt-stage{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;overflow:hidden;min-height:320px}
.rpt-stage .ev-loading{color:var(--faint);display:grid;place-items:center;min-height:200px}

/* Documento */
.rpt-doc{font-family:Arial,Helvetica,"IBM Plex Sans",sans-serif}
.rpt-preview .rpt-doc{transform-origin:top left}
.rpt-page{position:relative;width:297mm;min-height:210mm;background:#fff;color:#111;padding:20mm 18mm;margin:0 auto 16px;box-shadow:var(--shadow-lg);overflow:hidden}
.rpt-page:last-child{margin-bottom:0}
.rpt-corner{position:absolute;right:16mm;top:13mm;max-height:15mm;max-width:48mm;object-fit:contain;z-index:2;pointer-events:none}
.rpt-page.cover .rpt-corner{max-height:20mm;max-width:60mm}
.rpt-cornerph{position:absolute;right:16mm;top:13mm;width:38mm;height:14mm;border:1px dashed #cfcfcf;border-radius:4px;display:flex;align-items:center;justify-content:center;font:600 9px Arial,sans-serif;color:#bcbcbc;letter-spacing:.3px;text-transform:uppercase;z-index:2;pointer-events:none}
.rpt-page>*{position:relative;z-index:1}
.rpt-h1{font:700 26px Arial,sans-serif;margin:0 0 16px;letter-spacing:-.3px}
.rpt-h2{font:700 16px Arial,sans-serif;margin:16px 0 6px}
.rpt-empty{color:#999;font-style:italic;font-size:12px}
/* portada */
.rpt-page.cover .cov{position:absolute;left:18mm;bottom:24mm;max-width:62%;z-index:1}
.cov-word{font:800 46px Arial,sans-serif;letter-spacing:-1px;margin-bottom:14px}
.cov-word img.rpt-logo.lg{max-height:70px;max-width:60%}
.cov-proj{font:700 20px Arial,sans-serif;margin-bottom:2px}
.cov-sub{font:400 18px/1.35 Arial,sans-serif;margin-bottom:22px;max-width:34ch}
.cov-auth{margin-bottom:20px;color:#333;font-size:14px}
.cov-meta{font:400 15px/1.5 Arial,sans-serif}
/* TOC */
.rpt-toc .toc-1{font:700 15px Arial,sans-serif;margin-top:12px}
.rpt-toc .toc-2{font:400 14px Arial,sans-serif;margin:2px 0 0 18px;color:#333}
/* columnas */
.rpt-cols{column-count:2;column-gap:26px;font:400 13px/1.5 Arial,sans-serif;color:#111}
.rpt-cols h3.rpt-h2{margin-top:0}
.rpt-cols p{margin:0 0 8px}
.rpt-cols ul{margin:0 0 8px 16px;padding:0}
.rpt-cols li{margin:0 0 4px}
.rpt-metrics{display:flex;gap:8px;margin:4px 0 10px;break-inside:avoid}
.rpt-metrics>div{border:1px solid #ddd;border-radius:8px;padding:7px 10px;text-align:center;flex:1}
.rpt-metrics b{display:block;font:700 20px Arial,sans-serif}
.rpt-metrics span{font-size:10.5px;color:#666}
/* personas */
.rpt-personas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.persona{border:1px solid #ccc;border-radius:10px;padding:12px;font:400 11.5px/1.45 Arial,sans-serif;break-inside:avoid}
.pp-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.pp-head img,.pp-ph{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#e6e6e6;flex:none}
.pp-name{font:700 14px Arial,sans-serif}
.pp-title{font:700 12px Arial,sans-serif}
.pp-meta{color:#555;font-size:11px}
.pp-sec{margin-top:8px}
.pp-sec b{font:700 12px Arial,sans-serif;display:block;margin-bottom:3px}
.pp-sec ul{margin:0 0 0 15px;padding:0}
.pp-sec p{margin:0}
/* heurística */
.rpt-flowlabel{font:700 15px Arial,sans-serif;border-bottom:3px solid #111;padding-bottom:4px;margin:16px 0 12px}
.rpt-units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:6px}
.rpt-unit{break-inside:avoid}
.rpt-shot{position:relative;border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#f3f3f3}
.rpt-shot img{width:100%;display:block}
.rpt-shot.noimg{height:120px;display:grid;place-items:center;color:#999;font-size:12px}
.rpt-unit-t{font:700 12px Arial,sans-serif;margin:6px 0}
.rpt-finds{display:flex;flex-direction:column;gap:8px}
.rpt-finds.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rpt-find{display:flex;gap:7px;break-inside:avoid}
.rpt-pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);font:700 11px Arial,sans-serif;display:grid;place-items:center}
.rpt-pin.sm{position:static;transform:none;width:20px;height:20px;flex:none}
.rf{font:400 11px/1.4 Arial,sans-serif;color:#111}
.rf-t{font-weight:700;font-size:12px;margin-bottom:2px}
.rf-h{font-style:italic;color:#333;margin-bottom:3px}
.rf-p{margin-bottom:3px}
.rf-p b{font-weight:700}
/* diagnóstico */
.diag-b{break-inside:avoid;margin-bottom:12px}
.diag-b h4{font:700 14px Arial,sans-serif;margin:0 0 4px}
.diag-imp{margin-top:4px}
/* visor */
.rpt-viewer{position:fixed;inset:0;z-index:340;background:#3a3f45;display:flex;flex-direction:column}
.rpt-vbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.rv-title{font-weight:600}
.rv-status{font-size:12.5px;color:var(--muted);max-width:52ch;line-height:1.3}
.rv-status.err{color:var(--prob)}
.rv-status.ok{color:var(--opor)}
.rpt-vscroll{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rpt-vscroll .rpt-doc{display:flex;flex-direction:column;gap:16px}
@media(max-width:900px){.rpt-wrap{grid-template-columns:1fr}.rpt-preview{position:static}}
@media print{
  @page{size:A4 landscape;margin:0}
  body.printing-report{background:#fff}
  body.printing-report>*:not(#modalRoot2){display:none!important}
  body.printing-report #modalRoot2 .rpt-vbar{display:none!important}
  body.printing-report #modalRoot2 .rpt-viewer{position:static;background:#fff;display:block}
  body.printing-report #modalRoot2 .rpt-vscroll{position:static;overflow:visible;padding:0;display:block;background:#fff}
  body.printing-report #modalRoot2 .rpt-doc{display:block}
  .rpt-page{width:297mm;min-height:208mm;margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .rpt-page:last-child{page-break-after:auto;break-after:auto}
  .rpt-cornerph{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== Flujos ===== */
.flow-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.fl-title{display:flex;align-items:center;gap:9px}
.fl-title h3{font-size:18px;letter-spacing:-.01em}
.fl-legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted)}
.fl-legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.fl-legend i.desvio{border-top-style:dashed;border-top-color:var(--sev3)}
.fl-zoom{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden}
.fl-zoom button{background:var(--surface);border:none;border-right:1px solid var(--line);padding:6px 10px;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:13px;min-width:38px}
.fl-zoom button:last-child{border-right:none}
.fl-zoom button:hover{color:var(--ink);background:var(--surface-2)}
.flow-wrap{position:relative;height:clamp(440px,70vh,880px);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface-2);background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);background-size:24px 24px;touch-action:none;cursor:grab}
.flow-wrap.grabbing{cursor:grabbing}
.flow-canvas{position:absolute;top:0;left:0;transform-origin:0 0}
.flow-edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.flow-edges .edge-hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
.flow-edges .edge-line{pointer-events:none}
.flow-edges .edge-label{font-family:var(--mono);font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--surface-2);stroke-width:4px}
.fnode{position:absolute;width:212px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);cursor:grab;user-select:none;overflow:hidden}
.fnode:hover{border-color:var(--faint)}
.fnode-h{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line)}
.fnode-n{width:20px;height:20px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700}
:root[data-theme="dark"] .fnode-n,:root:not([data-theme="light"]) .fnode-n{color:#08201f}
.fnode-t{font-weight:600;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnode-del{background:none;border:none;color:var(--faint);cursor:pointer;padding:2px;display:grid;opacity:0;transition:.1s}
.fnode:hover .fnode-del{opacity:1}
.fnode-del:hover{color:var(--prob)}
.fnode-img{height:96px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.fnode-img img{width:100%;height:100%;object-fit:cover;display:block}
.fnode-noimg{height:52px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--faint);font-size:11.5px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.fnode-noimg svg{width:15px;height:15px}
.fnode-body{padding:8px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.fnode-body b{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.fnode-foot{padding:7px 10px;border-top:1px solid var(--line);display:flex}
.fnode-hz{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.fnode-hz.has{color:var(--prob)}
.fnode-handle{position:absolute;right:-7px;top:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:crosshair;opacity:0;transition:.1s}
.fnode:hover .fnode-handle{opacity:1}
.flow-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);pointer-events:none}
.flow-empty *{pointer-events:auto}
.flow-empty .ico{width:40px;height:40px;color:var(--faint);margin-bottom:12px}
.flow-empty h3{color:var(--ink);margin-bottom:6px}
.flow-empty p{max-width:36ch;margin:0 auto 16px;font-size:13.5px}
.flow-help{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--faint);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:4px 9px;border-radius:20px;pointer-events:none}

/* Detalle de interacción */
.nd-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
.nd-work-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nd-stage{position:relative;height:clamp(420px,66vh,860px);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface-2);background-image:radial-gradient(circle,var(--line) 1px,transparent 1px);background-size:22px 22px;cursor:grab;touch-action:none}
.nd-stage.adding{cursor:crosshair}
.nd-stage .ev-drop{position:absolute;inset:14px;margin:0}
.nd-stage .ev-loading{position:absolute;inset:0;display:grid;place-items:center}
.nd-canvas{position:absolute;top:0;left:0;transform-origin:0 0;line-height:0;box-shadow:var(--shadow-lg)}
.nd-canvas img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;background:#fff}
.nd-pins{position:absolute;inset:0}
.nd-stage.adding .nd-pins{pointer-events:none}
.nd-imgpin{position:absolute;transform:translate(-50%,-50%) scale(var(--pk,1));transform-origin:center;width:28px;height:28px;border-radius:50%;color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.nd-imgdel{position:absolute;top:8px;right:8px;transform:scale(var(--pk,1));transform-origin:top right;background:rgba(15,22,32,.72);color:#fff;border:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;z-index:2}
.nd-imgdel:hover{background:var(--prob)}
.nd-hz-m{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nd-fields{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.nd-f{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px}
.nd-f b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.nd-hz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.nd-hz-head h4{font-size:15px}
.btn.on-add{background:var(--sev3);border-color:var(--sev3);color:#fff}
.nd-hz-list{display:flex;flex-direction:column;gap:8px}
.nd-hz{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px}
.nd-pin{width:24px;height:24px;flex:none;border-radius:50%;color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700}
.nd-hz-b{flex:1;min-width:0;cursor:pointer}
.nd-hz-t{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd-hz-m{margin-top:3px}
.rel-chip.f{border-left:2px solid var(--accent);color:var(--accent-strong)}
@media(max-width:820px){.nd-grid{grid-template-columns:1fr}}

/* ===== User Journey ===== */
.jr-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.jr-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.jr-matrix{min-width:max-content}
.jr-row{display:flex;border-bottom:1px solid var(--line)}
.jr-row:last-child{border-bottom:none}
.jr-lbl{width:160px;flex:none;position:sticky;left:0;z-index:3;background:var(--surface-2);border-right:1px solid var(--line);padding:11px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.jr-lbl small{display:block;font-weight:400;color:var(--faint);font-size:11px;margin-top:2px}
.jr-cells{display:flex}
.jr-cell{width:224px;flex:none;border-right:1px solid var(--line);padding:10px}
.jr-etapas .jr-lbl{background:var(--surface)}
.jr-band{height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12.5px;margin:8px 4px;flex:none;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-band.empty{background:var(--surface-2);color:var(--faint);border:1px dashed var(--line-strong)}
.jr-head .jr-cell{cursor:pointer;background:var(--surface)}
.jr-head .jr-cell:hover{background:var(--surface-2)}
.jr-pnum{font-family:var(--mono);font-size:11px;color:var(--faint)}
.jr-pname{font-weight:600;font-size:13.5px;margin-top:2px;line-height:1.25}
.jr-plink{font-size:11px;color:var(--accent);margin-top:4px;display:flex;align-items:center;gap:4px}
.jr-emo-cells{position:relative}
.jr-emo-cells>svg{position:absolute;top:0;left:0;z-index:1;pointer-events:none}
.jr-emo-cell{width:224px;flex:none;border-right:1px solid var(--line);height:110px;position:relative}
.jr-emo-btn{position:absolute;left:50%;transform:translateX(-50%);z-index:2;font-size:24px;line-height:1;background:var(--surface);border:1px solid var(--line-strong);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.jr-emo-btn:hover{border-color:var(--accent)}
.jr-ta{width:100%;min-height:70px;border:none;background:transparent;resize:vertical;font-size:12.5px;line-height:1.4;color:var(--ink);font-family:inherit;padding:0}
.jr-ta:focus{outline:none}
.jr-row.pain .jr-ta{color:var(--prob)}
.jr-row.exp .jr-ta{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:58px}
.jr-tp-desc{margin-top:7px}
.jr-pills{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-start}
.jr-pill{display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--line);border-radius:20px;padding:3px 5px 3px 10px;font-size:11.5px;max-width:100%;word-break:break-word;line-height:1.3}
.jr-pill-x{background:none;border:none;color:var(--faint);cursor:pointer;display:grid;place-items:center;padding:0;width:15px;height:15px;flex:none}
.jr-pill-x:hover{color:var(--prob)}
.jr-pill-x svg{width:11px;height:11px}
.jr-pill-in{border:none;background:transparent;font-size:12px;min-width:70px;flex:1;padding:3px 2px;color:var(--ink)}
.jr-pill-in:focus{outline:none}
.jr-row.pain .jr-pill{background:var(--prob-soft);color:var(--prob);border-color:transparent}
.jr-pills.cloud{gap:9px 8px}
.jr-pill.cloud{position:relative;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;padding:6px 6px 6px 10px;font-style:italic;margin-bottom:4px}
.jr-pill.cloud::after{content:"";position:absolute;left:14px;bottom:-5px;width:9px;height:9px;background:var(--surface-2);border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:rotate(45deg)}
.emo-pop{position:fixed;z-index:400;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:flex;gap:4px}
.emo-pop button{font-size:22px;width:42px;height:42px;border:none;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.emo-pop button:hover,.emo-pop button.on{background:var(--accent-soft)}
/* sliders de scroll + chevrones */
.jr-sbar{display:none;align-items:center;gap:8px;padding:6px 2px}
.jr-nav-btn{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.jr-nav-btn:hover{color:var(--ink);border-color:var(--faint)}
.jr-range{flex:1;height:6px;accent-color:var(--accent);cursor:pointer}
/* cabecera de paso con contadores de relaciones */
.jr-head-cell{display:flex;flex-direction:column;gap:6px;cursor:default}
.jr-head .jr-head-cell:hover{background:var(--surface)}
.jr-phead{cursor:pointer}
.jr-phead:hover .jr-pname{color:var(--accent)}
.jr-rels{display:flex;gap:6px}
.jr-rel{display:inline-flex;align-items:center;gap:4px;font-size:11px;border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:2px 9px;color:var(--muted);cursor:pointer;font-family:var(--mono)}
.jr-rel:hover{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
.jr-rel.fl:hover{color:var(--accent-strong)}
.jr-rel svg{width:11px;height:11px}
/* sidebar de relaciones */
.jr-side-bg{position:fixed;inset:0;background:rgba(15,22,32,.28);z-index:210}
.jr-side{position:fixed;top:0;right:0;height:100vh;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:211;display:flex;flex-direction:column}
.jr-side-rz{position:absolute;left:-3px;top:0;width:7px;height:100%;cursor:ew-resize;z-index:2}
.jr-side-rz:hover{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.jr-side-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.jr-side-title{font-weight:600;font-size:15px}
.jr-side-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.jr-side-body{flex:1;overflow-y:auto;padding:16px 18px}
.jr-side-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.jr-side-list{display:flex;flex-direction:column;gap:7px}
.jr-side-row{display:flex;align-items:center;gap:6px}
.jr-side-rm{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.jr-side-rm:hover{border-color:var(--line-strong)}
.jr-side-dot{width:12px;height:12px;flex:none;border-radius:50%}
.jr-side-rt{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-side-x{flex:none;background:none;border:none;color:var(--faint);cursor:pointer;padding:4px;display:grid}
.jr-side-x:hover{color:var(--prob)}
.jr-side-desc{color:var(--muted);font-size:13px;margin:0 0 8px}
.jr-side-meta{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-bottom:12px}
.jr-side-nodes{display:flex;flex-direction:column;gap:8px}
.jr-side-node{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.jr-side-nimg{width:56px;height:42px;flex:none;border-radius:6px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--faint)}
.jr-side-nimg img{width:100%;height:100%;object-fit:cover}
.jr-side-nimg svg{width:16px;height:16px}
.jr-side-nt{font-size:13px;font-weight:500}
.jr-side-nhz{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;display:flex;align-items:center;gap:4px}
@media(max-width:560px){ .jr-side{width:100%!important} .jr-side-rz{display:none} }

/* ===== Reporte online (cliente) ===== */
#clientRoot{position:fixed;inset:0;z-index:500;background:var(--ground);overflow:auto;color:var(--ink)}
.cr-gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.cr-gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:30px;width:100%;max-width:380px;text-align:center}
.cr-gate-brand{margin-bottom:14px;min-height:30px}
.cr-gate-card h2{font-size:20px;margin-bottom:2px}
.cr-gate-card>p{color:var(--muted);margin-bottom:18px}
.cr-gate-card label{display:block;text-align:left;font-size:12.5px;font-weight:600;margin-bottom:5px}
.cr-gate-card input{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:14px}
.cr-gate-card .btn{width:100%;justify-content:center}
.cr-gate-msg{color:var(--prob);font-size:12.5px;margin-top:10px;min-height:16px}
.cr-app{min-height:100%;display:flex;flex-direction:column}
.cr-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px 20px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.cr-brand img,.cr-brand .cr-word{vertical-align:middle}
.cr-word{font-family:var(--display);font-weight:700;font-size:18px}
.cr-study{line-height:1.2}
.cr-cli{font-size:12px;color:var(--muted)}
.cr-name{font-weight:600}
.cr-body{display:grid;grid-template-columns:220px 1fr;flex:1;min-height:0}
.cr-nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:58px;align-self:start}
.cr-nav button{display:flex;align-items:center;gap:9px;background:none;border:none;text-align:left;padding:9px 11px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer}
.cr-nav button:hover{background:var(--surface-2);color:var(--ink)}
.cr-nav button.on{background:var(--accent-soft);color:var(--accent-strong)}
.cr-nav .cr-cnt{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--surface-2);border-radius:20px;padding:1px 7px}
.cr-main{padding:26px 30px;max-width:960px;width:100%}
.cr-main h1{font-size:30px;letter-spacing:-.02em;margin-bottom:4px}
.cr-main h2{font-size:22px;margin-bottom:16px}
.cr-main h3{font-size:16px;margin:22px 0 10px}
.cr-teaser{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-strong);border-radius:10px;padding:11px 14px;font-size:13.5px;margin-bottom:20px}
.cr-hero{margin-bottom:18px}
.cr-hero .cr-sub{color:var(--muted);font-size:15px}
.cr-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cr-meta span{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.cr-prose{color:var(--ink);line-height:1.6;font-size:14.5px}
.cr-prose p{margin:0 0 10px}
.cr-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.cr-tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.cr-tile b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.cr-tile span{font-size:12px;color:var(--muted)}
.cr-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cr-filters select{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 10px;color:var(--muted)}
.cr-hz-list{display:flex;flex-direction:column;gap:11px}
.cr-empty{color:var(--faint);font-style:italic;padding:20px 0}
.cr-flow{margin-bottom:28px}
.cr-flow-h h3{margin:0 0 2px}
.cr-flow-h p{color:var(--muted);font-size:13px;margin:0 0 12px}
.cr-tp-desc{font-size:12px;color:var(--muted);margin-top:6px}
.cr-dash{color:var(--faint)}
.cr-personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cr-persona{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);font-size:12.5px;line-height:1.45}
.cr-block{margin-bottom:14px}
.cr-block h4{font-size:15px;margin-bottom:4px}
.cr-imp{color:var(--muted);font-size:13px}
.cr-lead{color:var(--muted);margin-bottom:16px}
.cr-props{display:grid;gap:12px;margin-bottom:24px}
.cr-prop{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface)}
.cr-prop h4{font-size:16px;margin-bottom:6px}
.cr-prop-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.cr-prop-top h4{margin:0}
.cr-prop-tag{font-size:11.5px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border-radius:20px;padding:2px 10px;white-space:nowrap;flex:none}
.cr-prop-price{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:2px 0 10px}
.cr-prop-price.has-launch{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.cr-prop-was{font-size:15px;font-weight:600;color:var(--faint);text-decoration:line-through;text-decoration-color:var(--prob)}
.cr-prop-now{color:var(--prob)}
.cr-prop-launch{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--prob);border-radius:20px;padding:3px 9px;align-self:center}
.cr-prop-urg{font-size:12px;color:var(--prob);font-weight:600;margin-bottom:10px}
.cr-prop-disc{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.cr-prop-disc>b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:6px;font-weight:500}
.cr-prop-disc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.cr-prop-disc li{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.cr-prop-disc li span:last-child{color:var(--accent-strong);font-weight:600;white-space:nowrap;text-align:right}
.cr-contact{display:flex;gap:20px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.cr-contact-main{flex:1;min-width:220px}
.cr-contact-name{font-weight:600;margin-top:6px}
.cr-contact-rol{color:var(--muted);font-size:13px}
.cr-contact-lines{display:flex;flex-direction:column;gap:3px;margin-top:10px}

let DB=null, USE_DB=false;
/* Adaptador IndexedDB con la MISMA API tipo Firestore que espera store/flowStore/
   brandStore (DB.collection(path).get() y DB.doc(path).get()/set()/delete()).
   Es el backend de persistencia cuando la app corre fuera de claude.ai (self-hosted).
   Un único object store "docs" indexado por la ruta completa; las colecciones se
   resuelven por prefijo tomando solo los hijos directos. */
function makeIDBAdapter(){
  const DBNAME="lupaux", STORE="docs", VER=1;
  let _p=null;
  function open(){
    if(_p)return _p;
    _p=new Promise((res,rej)=>{
      const rq=indexedDB.open(DBNAME,VER);
      rq.onupgradeneeded=()=>{ const db=rq.result; if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"_path"}); };
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    });
    return _p;
  }
  function tx(mode){ return open().then(db=>db.transaction(STORE,mode).objectStore(STORE)); }
  const clone=o=>JSON.parse(JSON.stringify(o==null?{}:o));
  const lastSeg=p=>{ const i=p.lastIndexOf("/"); return i<0?p:p.slice(i+1); };
  function docGet(path){ return tx("readonly").then(os=>new Promise((res,rej)=>{ const rq=os.get(path); rq.onsuccess=()=>{ const rec=rq.result; res({ exists:!!rec, id:lastSeg(path), data:()=> rec?clone(rec.data):{} }); }; rq.onerror=()=>rej(rq.error); })); }
  function docSet(path,data){ return tx("readwrite").then(os=>new Promise((res,rej)=>{ const rq=os.put({_path:path,data:clone(data)}); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error); })); }
  function docDelete(path){ return tx("readwrite").then(os=>new Promise((res,rej)=>{ const rq=os.delete(path); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error); })); }
  function collectionGet(path){ return tx("readonly").then(os=>new Promise((res,rej)=>{ const out=[]; const lo=path+"/"; const range=IDBKeyRange.bound(lo,lo+"￿",false,false); const rq=os.openCursor(range); rq.onsuccess=()=>{ const cur=rq.result; if(!cur){ res({docs:out}); return; } const rest=String(cur.key).slice(lo.length); if(rest && rest.indexOf("/")===-1){ const snap=clone(cur.value.data); out.push({ id:rest, data:()=>snap }); } cur.continue(); }; rq.onerror=()=>rej(rq.error); })); }
  function dumpAll(){ return tx("readonly").then(os=>new Promise((res,rej)=>{ const rq=os.getAll(); rq.onsuccess=()=>res(rq.result.map(r=>({path:r._path,data:r.data}))); rq.onerror=()=>rej(rq.error); })); }
  return {
    ready:()=>open(),
    dumpAll,
    collection:(path)=>({ get:()=>collectionGet(path) }),
    doc:(path)=>({ get:()=>docGet(path), set:(d)=>docSet(path,d), delete:()=>docDelete(path) })
  };
}
/* Adaptador HTTP: misma API, contra la API de Cloudflare Pages Functions + D1
   (functions/api). Se usa cuando la app está hosteada con backend. La sesión de
   Cloudflare Access viaja en la cookie, no hace falta manejar tokens acá. */
function makeHTTPAdapter(base){
  base=base||"api";
  async function call(method,route,path,body){
    let r;
    try{
      r=await fetch(base+"/"+route+(path?"?path="+encodeURIComponent(path):""),{
        method, credentials:"same-origin", headers:body!==undefined?{"content-type":"application/json"}:{},
        body:body!==undefined?JSON.stringify(body):undefined
      });
    }catch(e){ throw new Error("Sin conexión con el servidor (o la sesión venció: recargá la página)."); }
    const ct=r.headers.get("content-type")||"";
    if(!ct.includes("application/json")) throw new Error("La sesión venció o el servidor no respondió bien. Recargá la página.");
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||("Error "+r.status));
    return j;
  }
  const lastSeg=p=>{ const i=p.lastIndexOf("/"); return i<0?p:p.slice(i+1); };
  return {
    ready:()=>call("GET","health"),
    dumpAll:async()=>(await call("GET","export")).docs,
    collection:(path)=>({ get:async()=>{ const j=await call("GET","collection",path); return {docs:j.docs.map(d=>({id:d.id,data:()=>d.data}))}; } }),
    doc:(path)=>({
      get:async()=>{ const j=await call("GET","doc",path); return {exists:j.exists,id:lastSeg(path),data:()=>j.data||{}}; },
      set:(d)=>call("PUT","doc",path,d==null?{}:d).then(()=>{}),
      delete:()=>call("DELETE","doc",path).then(()=>{})
    })
  };
}
/* Backend activo: "claude" (runtime de claude.ai), "server" (API + D1),
   "idb" (IndexedDB del navegador) o "none" (sin persistencia disponible). */
let DB_MODE="none";
const store = {
  async listEstudios(){
    if(USE_DB){const s=await DB.collection("estudios").get();return s.docs.map(d=>({id:d.id,...d.data()}));}
    return LS.get("lupa:estudios",[]);
  },
  async saveEstudio(e){
    if(USE_DB){await DB.doc("estudios/"+e.id).set(stripId(e));}
    else{const a=LS.get("lupa:estudios",[]);const i=a.findIndex(x=>x.id===e.id);i>=0?a[i]=e:a.push(e);LS.set("lupa:estudios",a);}
  },
  async delEstudio(id){
    if(USE_DB){
      const hs=await DB.collection("estudios/"+id+"/hallazgos").get();
      for(const d of hs.docs){
        const imgs=await DB.collection("estudios/"+id+"/hallazgos/"+d.id+"/imgs").get();
        await Promise.all(imgs.docs.map(im=>DB.doc("estudios/"+id+"/hallazgos/"+d.id+"/imgs/"+im.id).delete()));
        await DB.doc("estudios/"+id+"/hallazgos/"+d.id).delete();
      }
      await DB.doc("estudios/"+id).delete();
    } else {
      LS.get("lupa:hz:"+id,[]).forEach(h=>LS.del("lupa:full:"+h.id));
      LS.set("lupa:estudios",LS.get("lupa:estudios",[]).filter(x=>x.id!==id));LS.del("lupa:hz:"+id);
    }
  },
  async listHallazgos(sid){
    if(USE_DB){const s=await DB.collection("estudios/"+sid+"/hallazgos").get();return s.docs.map(d=>({id:d.id,...d.data()}));}
    return LS.get("lupa:hz:"+sid,[]);
  },
  async saveHallazgo(sid,h){
    if(USE_DB){await DB.doc("estudios/"+sid+"/hallazgos/"+h.id).set(stripId(h));}
    else{const a=LS.get("lupa:hz:"+sid,[]);const i=a.findIndex(x=>x.id===h.id);i>=0?a[i]=h:a.push(h);LS.set("lupa:hz:"+sid,a);}
  },
  async delHallazgo(sid,id){
    if(USE_DB){
      const imgs=await DB.collection("estudios/"+sid+"/hallazgos/"+id+"/imgs").get();
      await Promise.all(imgs.docs.map(im=>DB.doc("estudios/"+sid+"/hallazgos/"+id+"/imgs/"+im.id).delete()));
      await DB.doc("estudios/"+sid+"/hallazgos/"+id).delete();
    } else {LS.set("lupa:hz:"+sid,LS.get("lupa:hz:"+sid,[]).filter(x=>x.id!==id));LS.del("lupa:full:"+id);}
  },
  async getFull(sid,hid,imgId){
    if(USE_DB){const d=await DB.doc("estudios/"+sid+"/hallazgos/"+hid+"/imgs/"+imgId).get();return d.exists?d.data().full:null;}
    const m=LS.get("lupa:full:"+hid,{});return m[imgId]?m[imgId].full:null;
  },
  async getImg(sid,hid,imgId){
    let x=null;
    if(USE_DB){const d=await DB.doc("estudios/"+sid+"/hallazgos/"+hid+"/imgs/"+imgId).get();if(d.exists)x=d.data();}
    else{const m=LS.get("lupa:full:"+hid,{});x=m[imgId]||null;}
    return x?{base:x.full||x.base,w:x.w,h:x.h,ann:x.ann||[]}:null;
  },
  async putFull(sid,hid,imgId,rec){
    if(USE_DB){await DB.doc("estudios/"+sid+"/hallazgos/"+hid+"/imgs/"+imgId).set(rec);}
    else{const m=LS.get("lupa:full:"+hid,{});m[imgId]=rec;LS.set("lupa:full:"+hid,m);}
  },
  async delFull(sid,hid,imgId){
    if(USE_DB){await DB.doc("estudios/"+sid+"/hallazgos/"+hid+"/imgs/"+imgId).delete();}
    else{const m=LS.get("lupa:full:"+hid,{});delete m[imgId];LS.set("lupa:full:"+hid,m);}
  },
  async listCustom(kind){ // "heur" | "sesgo"
    const coll="cat_"+kind, key="lupa:cat:"+kind;
    if(USE_DB){const s=await DB.collection(coll).get();return s.docs.map(d=>({id:d.id,...d.data()}));}
    return LS.get(key,[]);
  },
  async saveCustom(kind,item){
    const coll="cat_"+kind, key="lupa:cat:"+kind;
    if(USE_DB){await DB.doc(coll+"/"+item.id).set(stripId(item));}
    else{const a=LS.get(key,[]);const i=a.findIndex(x=>x.id===item.id);i>=0?a[i]=item:a.push(item);LS.set(key,a);}
  },
  async delCustom(kind,id){
    const coll="cat_"+kind, key="lupa:cat:"+kind;
    if(USE_DB){await DB.doc(coll+"/"+id).delete();}
    else{LS.set(key,LS.get(key,[]).filter(x=>x.id!==id));}
  }
};

  </div>
  <div class="hz-list" id="hzList"></div>`;

  document.getElementById("newHz").onclick=()=>hzModal(null);
  document.getElementById("hzSearch").oninput=e=>{state.hzQuery=e.target.value;renderHzList();};

  document.getElementById("fHeur").onchange=e=>{state.hzHeur=e.target.value;renderHzList();};

}
function renderHzList(){
  const q=state.hzQuery.trim().toLowerCase();
  let list=state.hallazgos.filter(h=>{
    if(state.hzTipo!=="todos"&&h.tipo!==state.hzTipo)return false;
    if(state.hzSev!=="todos"&&String(h.severidad)!==String(state.hzSev))return false;
    if(state.hzHeur!=="todos"&&!(h.heuristicas||[]).includes(state.hzHeur))return false;
    if(q&&!((h.titulo+" "+(h.descripcion||"")+" "+(h.pantalla||"")+" "+(h.tags||[]).join(" ")).toLowerCase().includes(q)))return false;
    return true;
  });
  const order={Problema:0,Oportunidad:1,"Observación":2};
  list.sort((a,b)=>(order[a.tipo]-order[b.tipo])||((b.severidad??-1)-(a.severidad??-1)));
  const el=document.getElementById("hzList");
  if(!state.hallazgos.length){
    el.innerHTML=`<div class="empty">${bigIco('flag')}<h3>Sin hallazgos todavía</h3>
      <p>Registrá el primer problema, oportunidad u observación de este estudio.</p>
      <button class="btn primary" id="newHz2">${plus()} Nuevo hallazgo</button></div>`;
    document.getElementById("newHz2").onclick=()=>hzModal(null); return;
  }
  if(!list.length){ el.innerHTML=emptyInline("Ningún hallazgo coincide con los filtros."); return; }
  el.innerHTML=list.map(hzCard).join("");
  el.querySelectorAll("[data-hz]").forEach(c=>{
    c.querySelector(".edit").onclick=()=>hzModal(state.hallazgos.find(h=>h.id===c.dataset.hz));
    c.querySelector(".del").onclick=()=>confirmDelHz(c.dataset.hz);
    c.querySelectorAll(".hz-thumbs .t").forEach((t,idx)=>t.onclick=e=>{e.stopPropagation();openHzLightbox(c.dataset.hz,idx);});
    const moreB=c.querySelector(".hz-thumbs .more"); if(moreB)moreB.onclick=e=>{e.stopPropagation();openHzLightbox(c.dataset.hz,5);};
  });
}

  // panel de evidencia (columna derecha)

async function cleanFlowMarkers(sid,hallazgoId){
  try{
    const flows=(state._flujosFor===sid)?state.flujos:await flowStore.list(sid);
    for(const f of flows){
      let changed=false;
      (f.nodes||[]).forEach(n=>{const before=(n.markers||[]).length;n.markers=(n.markers||[]).filter(m=>m.hallazgoId!==hallazgoId);if(n.markers.length!==before)changed=true;});
      if(changed)await flowStore.save(sid,f);
    }
    if(state._flujosFor===sid)state.flujos=flows;

/* ---- Imágenes: procesamiento, miniaturas y visor ---- */
function loadBitmap(blob){
  if(window.createImageBitmap) return createImageBitmap(blob).catch(()=>loadViaImg(blob));
  return loadViaImg(blob);
}
function loadViaImg(blob){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(blob);const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
}
function scaleImg(src,maxW,quality,maxChars){
  let w=src.width,h=src.height;
  if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
  const c=document.createElement("canvas");c.width=w;c.height=h;
  c.getContext("2d").drawImage(src,0,0,w,h);
  let q=quality,url=c.toDataURL("image/jpeg",q);
  while(maxChars&&url.length>maxChars&&q>0.4){q-=0.1;url=c.toDataURL("image/jpeg",q);}
  while(maxChars&&url.length>maxChars&&w>420){w=Math.round(w*0.85);h=Math.round(h*0.85);c.width=w;c.height=h;c.getContext("2d").drawImage(src,0,0,w,h);url=c.toDataURL("image/jpeg",q);}
  return {dataUrl:url,w,h};
}
async function processImage(blob){
  const bmp=await loadBitmap(blob);
  const full=scaleImg(bmp,1280,0.72,240000);
  const thumb=scaleImg(bmp,220,0.6,0);
  if(bmp.close)bmp.close();
  return {full,thumb};
}
function hzThumbs(h){
  const max=5, shown=h.imgs.slice(0,max), extra=h.imgs.length-max;
  return `<div class="hz-thumbs">${shown.map(im=>`<div class="t"><img src="${im.thumb}" alt="Evidencia"></div>`).join("")}${extra>0?`<div class="more">+${extra}</div>`:""}</div>`;
}
function openHzLightbox(hid,start){
  const h=state.hallazgos.find(x=>x.id===hid); if(!h||!h.imgs||!h.imgs.length)return;

function openLightbox(items,start){
  let i=start||0;
  const root=document.getElementById("modalRoot2")||(()=>{const d=document.createElement("div");d.id="modalRoot2";document.body.appendChild(d);return d;})();
  const close=()=>{root.innerHTML="";document.removeEventListener("keydown",key);};
  const go=d=>{i=(i+d+items.length)%items.length;draw();};
  const key=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1);};
  function draw(){
    root.innerHTML=`<div class="lb-bg"><button class="lb-close" id="lbClose">${x()}</button>
      <div class="lb-loading" id="lbImg">Cargando...</div>
      <div class="lb-bar">

function imgFromDataUrl(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});}

async function compositeDataUrl(d,quality){

function hitTest(anns,x,y){

  function anchors(n){const el=nodeEls[n.id];const w=el?el.offsetWidth:NODE_W,h=el?el.offsetHeight:80;return {sx:n.x+w,sy:n.y+h/2,tx:n.x,ty:n.y+h/2,h};}

    });
  }
  function placePin(clientX,clientY){
    if(!imgEl)return; const r=imgEl.getBoundingClientRect();
    const fx=(clientX-r.left)/r.width, fy=(clientY-r.top)/r.height;
    if(fx<0||fx>1||fy<0||fy>1)return;
    setAdd(false);
    hzModal({tipo:"Problema",severidad:3,pantalla:node.titulo,heuristicas:[],sesgos:[],tags:[],flujoId:flow.id,interaccionId:node.id,interaccionTitulo:node.titulo},
      {onSaved:async(hid)=>{ node.markers=node.markers||[]; node.markers.push({id:uid(),x:fx,y:fy,hallazgoId:hid}); await saveActiveFlow(); }});
  }
  async function setImage(blob){
    try{ const r=await processImage(blob); const imgId=node.imgId||uid();
      await flowStore.putImg(state.activeId,flow.id,imgId,{full:r.full.dataUrl,w:r.full.w,h:r.full.h});
      node.imgId=imgId; node.imgThumb=r.thumb.dataUrl; node.imgW=r.full.w; node.imgH=r.full.h; state.ndVP=null;

    }catch(e){toast("No se pudo procesar la imagen");}
  }
  function buildStage(){
    if(!node.imgId){
      stage.innerHTML=`<div class="ev-drop" id="ndDrop" tabindex="0">${camIco()}<div class="pz-main">Pegá una captura con <kbd>Ctrl/Cmd</kbd> + <kbd>V</kbd></div><div class="pz-sub">o arrastrala, o hacé clic para elegir un archivo</div><input type="file" id="ndFile" accept="image/*" hidden></div>`;
      const drop=stage.querySelector("#ndDrop"), file=stage.querySelector("#ndFile");
      drop.onclick=()=>file.click();
      file.onchange=async e=>{const f=e.target.files[0];if(f&&f.type.indexOf("image")===0)await setImage(f);};
      drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag");}; drop.ondragleave=()=>drop.classList.remove("drag");
      drop.ondrop=async e=>{e.preventDefault();drop.classList.remove("drag");const f=e.dataTransfer.files[0];if(f&&f.type.indexOf("image")===0)await setImage(f);};
      return;
    }
    stage.innerHTML=`<div class="nd-canvas" id="ndCanvas"><img id="ndImg" draggable="false" alt=""><div class="nd-pins" id="ndPins"></div><button class="nd-imgdel" id="ndImgDel" title="Quitar imagen">${trash()}</button></div>`;
    canvasEl=stage.querySelector("#ndCanvas"); imgEl=stage.querySelector("#ndImg"); pinsEl=stage.querySelector("#ndPins");
    stage.querySelector("#ndImgDel").onclick=e=>{ e.stopPropagation(); openConfirm("Quitar imagen","Se quita la imagen de esta interacción. Los hallazgos vinculados se conservan pero pierden su marca de posición.",async()=>{ await flowStore.delImg(state.activeId,flow.id,node.imgId); node.imgId=null;node.imgThumb=null;node.markers=[];state.ndVP=null; await saveActiveFlow(); render(); }); };
    (async()=>{
      const d=await flowStore.getImg(state.activeId,flow.id,node.imgId);
      if(!d){stage.innerHTML=`<div class="ev-loading">No se pudo cargar la imagen.</div>`;return;}
      imgEl.onload=()=>{ natW=imgEl.naturalWidth||node.imgW||800; natH=imgEl.naturalHeight||node.imgH||600; canvasEl.style.width=natW+"px"; canvasEl.style.height=natH+"px"; if(state.ndVP){vp=state.ndVP;applyVP();}else{requestAnimationFrame(fitView);} renderPins(); };
      imgEl.src=d.full;
    })();
    // interacción: zoom, pan, marcar
    stage.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:0.89);},{passive:false});
    let down=false,moved=false,startPan=null;
    stage.addEventListener("pointerdown",e=>{ if(e.target.closest(".nd-imgdel"))return; if(e.target.closest(".nd-imgpin")&&!addMode)return; down=true;moved=false;startPan=[e.clientX,e.clientY,vp.x,vp.y]; });
    const move=e=>{ if(!down)return; const dx=e.clientX-startPan[0],dy=e.clientY-startPan[1]; if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true; if(moved){vp.x=startPan[2]+dx;vp.y=startPan[3]+dy;applyVP();} };
    const up=e=>{ if(!down)return; down=false; if(!moved&&addMode)placePin(e.clientX,e.clientY); };
    window._ndMove=move; window._ndUp=up; window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
  }
  c.querySelector("#ndBack") && (c.querySelector("#ndBack").title="Volver al diagrama");
  addBtn.onclick=()=>setAdd(!addMode);
  c.querySelector("#ndZIn").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.2);};
  c.querySelector("#ndZOut").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2);};
  c.querySelector("#ndZFit").onclick=()=>fitView();
  const onKey=e=>{ if(e.key==="Escape"&&addMode)setAdd(false); };
  window._ndKey=onKey; window.addEventListener("keydown",onKey);
  const onPaste=async e=>{const items=e.clipboardData&&e.clipboardData.items;if(!items)return;for(const it of items){if(it.type&&it.type.indexOf("image")===0){e.preventDefault();const b=it.getAsFile();if(b)await setImage(b);break;}}};
  window._ndPaste=onPaste; document.addEventListener("paste",onPaste);
  buildStage(); renderHzList();
}

const JR_CARRILES=[

let _jrSaveT;

function jrCleanupPop(){ const p=document.getElementById("emoPop"); if(p)p.remove(); if(window._jrPopClose){document.removeEventListener("pointerdown",window._jrPopClose,true);window._jrPopClose=null;} }
function emoTop(e){ return 8+(4-(e!=null?e:2))/4*50; }
function jrNormalizePaso(p){
  if(typeof p.touchpoint!=="string") p.touchpoint=p.touchpoint?String(p.touchpoint):"";
  ["tpPills","acciones","expectativas","pain","oportunidades"].forEach(f=>{
    if(typeof p[f]==="string") p[f]=p[f].trim()?[p[f].trim()]:[];
    else if(!Array.isArray(p[f])) p[f]=[];
  });

function jrPillEditor(box,arr,onChange,cloud){
  function draw(focusEnd){
    box.innerHTML=arr.map((t,i)=>`<span class="jr-pill ${cloud?'cloud':''}">${esc(t)}<button type="button" class="jr-pill-x" data-i="${i}" title="Quitar">${x()}</button></span>`).join("")
      +`<input class="jr-pill-in" maxlength="140" placeholder="+ agregar">`;
    box.querySelectorAll(".jr-pill-x").forEach(b=>b.onclick=()=>{ arr.splice(+b.dataset.i,1); onChange(); draw(true); });
    const inp=box.querySelector(".jr-pill-in");
    inp.onkeydown=e=>{
      if(e.key==="Enter"){ e.preventDefault(); const v=inp.value.trim().slice(0,140); if(v){ arr.push(v); onChange(); draw(true); } }
      else if(e.key==="Backspace"&&!inp.value&&arr.length){ arr.pop(); onChange(); draw(true); }
    };
    if(focusEnd){ const ni=box.querySelector(".jr-pill-in"); if(ni)ni.focus(); }
  }
  draw(false);
}
function renderJourneyEditor(c,jr){
  jr.etapas=jr.etapas||[]; jr.pasos=jr.pasos||[]; jr.carriles=jr.carriles||jrDefaultCarriles();

  pasos.forEach(jrNormalizePaso);
  const labelFor=id=>{ const k=JR_CARRILES.find(x=>x.id===id); return k.label+(k.sub?`<small>${k.sub}</small>`:""); };
  let html=`<div class="jr-bar">
    <button class="btn ghost sm" id="jrBack">${chevL()} Flujos</button>

    html+=`<div class="empty">${bigIco('chart')}<h3>Journey vacío</h3><p>Agregá el primer paso para empezar a mapear la experiencia por etapas.</p><button class="btn primary" id="jrAddPaso2">${plus()} Agregar paso</button></div>`;

  const heads=pasos.map((p,i)=>{

      <div class="jr-rels"><button class="jr-rel" data-rel="hallazgos" data-p="${i}" title="Hallazgos relacionados">${flagIco()} ${(p.hallazgos||[]).length}</button><button class="jr-rel fl" data-rel="flujos" data-p="${i}" title="User Flows relacionados">${flowIco()} ${(p.flujos||[]).length}</button></div></div>`; }).join("");
  const pillRow=(field,cls,cloud)=>`<div class="jr-row ${cls||''}"><div class="jr-lbl">${labelFor(field)}</div><div class="jr-cells">${pasos.map((p,i)=>`<div class="jr-cell"><div class="jr-pills ${cloud?'cloud':''}" data-p="${i}" data-f="${field}"></div></div>`).join("")}</div></div>`;

  if(car.emocion!==false){
    const emoCells=pasos.map((p,i)=>{ const e=(p.emocion!=null?p.emocion:2); return `<div class="jr-emo-cell"><button class="jr-emo-btn" data-emo="${i}" style="top:${emoTop(e)}px" title="${EMO[e].label}">${EMO[e].emoji}</button></div>`; }).join("");

  html+=`${sbar("top")}<div class="jr-scroll" id="jrScroll"><div class="jr-matrix">

  // scroll sincronizado con sliders + chevrones
  const scroll=c.querySelector("#jrScroll"), ranges=[...c.querySelectorAll(".jr-range")], sbars=[...c.querySelectorAll(".jr-sbar")];
  const maxSc=()=>Math.max(0,scroll.scrollWidth-scroll.clientWidth);
  function syncSb(){ const ms=maxSc(); const v=ms?(scroll.scrollLeft/ms)*1000:0; ranges.forEach(r=>{ if(document.activeElement!==r)r.value=v; }); sbars.forEach(sb=>sb.style.display=ms>2?"flex":"none"); }
